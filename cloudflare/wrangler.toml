# XyDesk — Cloudflare Worker (signaling + auth)
# Tanpa VM/VPS. Deploy: `npx wrangler deploy` (gratis, tanpa kartu kredit).
name = "xydesk-signaling"
main = "src/worker.js"
compatibility_date = "2026-08-17"

# Browser produksi yang boleh memanggil API. Klien native tidak mengirim
# Origin, jadi pembatasan ini tidak mengganggu Android/desktop.
[vars]
CORS_ORIGINS = "https://app.xystudio.my.id"

# ── Durable Object: hub global (registri host + relay SDP/ICE) ──
[durable_objects]
bindings = [
  { name = "HUB", class_name = "Hub" },
  { name = "AUTH_STORE", class_name = "AuthStore" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthStore"]

# ── Variabel environment (rahasia ditaruh di wrangler secret, BUKAN di sini) ──
#   npx wrangler secret put XYDESK_SECRET   # rahasia bersama HMAC
#   npx wrangler secret put ADMIN_SECRET    # kunci endpoint /issue
#   npx wrangler secret put AUTH_SECRET     # (opsional) kunci JWT/OTP terpisah
#   npx wrangler secret put GOOGLE_CLIENT_ID # (opsional) utk Google OAuth asli
