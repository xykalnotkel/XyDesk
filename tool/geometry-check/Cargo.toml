[package]
name="geometry-check"
version="0.0.0"
edition="2021"
publish=false
[dependencies]
serde_json="1"
image={version="0.25",default-features=false,features=["jpeg","png","bmp"]}
serde={version="1",features=["derive"]}
[target.'cfg(target_os = "windows")'.dependencies]
windows={version="0.61",features=["Win32_Storage_FileSystem","Win32_System_LibraryLoader","Win32_Foundation","Win32_UI_HiDpi","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_Graphics_Gdi","Win32_Graphics_Direct3D","Win32_Graphics_Direct3D11","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common"]}
[profile.dev]
debug=0
