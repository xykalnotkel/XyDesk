# Crate PEMERIKSA TIPE, bukan produk. Tidak pernah dikemas atau dirilis.
#
# Alasannya ada di README.md. Singkatnya: CI Linux tidak pernah men-type-check
# kode `cfg(target_os = "windows")`, dan satu-satunya pemeriksaan nyata adalah
# job Windows di workflow Build yang (a) butuh dispatch operator dan (b) makan
# ~10 menit. Putaran umpan balik sepanjang itu membuat kode capture/registry
# yang sarat `unsafe` ditulis dengan menebak tanda tangan API — persis penyebab
# lima error kompilasi saat hwinfo.rs pertama kali dikirim.
[package]
name = "wincheck"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"

# Samakan dengan host/Cargo.toml bila modul yang diperiksa memakai API baru.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
] }
