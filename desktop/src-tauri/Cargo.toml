[package]
name = "xydesk-desktop"
version = "2.1.0"
description = "XyDesk untuk Windows — host & connect"
authors = ["XySpace Tch"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
