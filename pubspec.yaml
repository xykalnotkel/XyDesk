name: xydesk
description: "XyDesk — remote desktop low-latency untuk gaming dan kerja."
publish_to: 'none'
version: 6.5.4+32

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  http: ^1.6.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.0.0
  onesignal_flutter: ^5.6.7
  # Transport sesi remote (Fase 0 — loop capture->encode->kirim->decode).
  flutter_webrtc: ^1.5.2
  web_socket_channel: ^3.0.0
  package_info_plus: ^10.2.1
  # Ikon Lucide — stroke tipis konsisten, sesuai mockup.
  # Material Icons terlalu tebal/filled dan membuat UI terasa berbeda.
  lucide_icons_flutter: ^3.1.15
  url_launcher: ^6.3.0
  # Pemindai QR nyata (CameraX/MLKit) — menggantikan halaman demo.
  mobile_scanner: ^7.4.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_lints: ^4.0.0
  # Test widget & unit. Sengaja ditambahkan bersamaan dengan folder test/
  # pertama: logika protokol input (input_codec.dart) selama ini tidak pernah
  # diuji, padahal satu byte meleset = kursor melompat di mesin pengguna.
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/libraryicons/

  # Inter di-bundle langsung (bukan diunduh runtime) supaya tampilan
  # pasti sama di semua perangkat, termasuk tanpa internet.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
