include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: false
    avoid_print: true

analyzer:
  exclude:
    # client/ = drop-in WebRTC (belum di-wire ke app; dependensinya belum di
    # pubspec). Dikecualikan dari analisis sampai Fase 0 (lihat ROADMAP.md).
    - client/**
  errors:
    invalid_annotation_target: ignore
