# XyDesk Web (Vite + React) — frontend statis terpisah dari Worker API/signaling.
name = "xydesk-web"
main = "./worker/index.js"
compatibility_date = "2026-08-17"
workers_dev = true
preview_urls = true

# Domain aplikasi. Backend tetap di https://signal.xystudio.my.id.
routes = [
  { pattern = "app.xystudio.my.id", custom_domain = true }
]

[assets]
directory = "./site"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# Basis data berita yang sama dengan worker news (baca-saja untuk meta OG).
[[d1_databases]]
binding = "DB"
database_name = "xydesk-news"
database_id = "7ffccd9e-3432-47bf-b3e7-7492cbe56ea2"
