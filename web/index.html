<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>XyDesk — Remote Desktop Android, Windows & Web</title>
    <meta name="description" content="XyDesk adalah remote desktop ringan untuk kerja dan bermain. Download Android atau Windows, atau kendalikan PC langsung dari browser di iPhone dan iPad." />
    <meta name="keywords" content="remote desktop, remote pc, kendalikan pc, remote gaming, xydesk, remote desktop browser, remote desktop iphone" />
    <meta name="theme-color" content="#fafaf9" />

    <!-- Inter disajikan sendiri; pramuat yang paling sering dipakai -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="canonical" href="https://app.xystudio.my.id/" />

    <!-- Ikon (dari logo asli XyDesk) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="XyDesk" />
    <meta property="og:title" content="XyDesk — Remote Desktop untuk Semua Perangkat" />
    <meta property="og:description" content="Download untuk Android dan Windows, atau kendalikan PC langsung dari browser tanpa instalasi." />
    <meta property="og:url" content="https://app.xystudio.my.id/" />
    <meta property="og:image" content="https://app.xystudio.my.id/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XyDesk Web — Kendalikan PC dari Browser" />
    <meta name="twitter:description" content="Remote desktop low-latency untuk gaming dan kerja, langsung dari browser." />
    <meta name="twitter:image" content="https://app.xystudio.my.id/og-image.jpg" />

    <!-- iOS: jalankan sebagai web app dari home screen (pengganti app iOS
         selama belum ada akun Apple Developer). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="XyDesk" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "XyDesk Web",
      "url": "https://app.xystudio.my.id/",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "description": "Remote desktop low-latency untuk gaming dan kerja, langsung dari browser.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
