[package]
name = "xydesk-host"
version = "0.1.0"
edition = "2021"
description = "XyDesk host — capture & stream layar Windows via WebRTC"

[dependencies]
# Signaling client
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# WebRTC (host = answerer: terima offer dari client, kirim video + terima input)
webrtc = "0.11"
bytes = "1"
# ID perangkat + PIN pairing (generasi acak)
rand = "0.8"
# Encoder H264 software (cross-platform — pola uji di Linux, capture di Windows)
openh264 = "0.9.8"

# ── Capture layar (Windows-only) — DXGI Desktop Duplication ──
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0"
# Injeksi input via SendInput (user-mode, tanpa driver) — lihat src/input.rs
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

# ── Fase capture/encode (Windows-only) — aktifkan saat implementasi ──
# windows-capture = "1"              # DXGI Desktop Duplication
# ffmpeg-next = "6"                  # encode NVENC/AMF/QuickSync (jalur cepat PoC)

[profile.release]
opt-level = 3
lto = "thin"
