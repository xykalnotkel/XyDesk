[package]
name = "xydesk-host"
version = "6.2.1"
edition = "2021"
description = "XyDesk host — capture & stream layar Windows via WebRTC"

[[bin]]
name = "xydesk-host"
path = "src/main.rs"

# GUI native Win32 — SATU jendela, tanpa WebView/browser.
[[bin]]
name = "xydesk"
path = "src/bin/gui.rs"

[dependencies]
# Signaling client
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# WebRTC (host = answerer: terima offer dari client, kirim video + terima input)
webrtc = "0.11"
bytes = "1"
# ID perangkat + PIN pairing (generasi acak)
rand = "0.8"
# Hash untuk perbandingan password konstan-waktu (lihat identity::verify_password)
sha2 = "0.10"
# Encoder H264 software (lintas platform — pola visual di Linux, capture di Windows)
openh264 = "0.9.8"
# Control API lokal untuk shell desktop (HTTP 127.0.0.1, lihat src/control.rs)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

# ── Capture layar (Windows-only) — DXGI Desktop Duplication ──
# Audio: WASAPI loopback → Opus lewat libopus VENDOR (vendor/opus + build.rs
# + opus_ffi.rs) — bukan crate `opus` (audiopus_sys gagal build di Windows).
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0"
# Injeksi input via SendInput (user-mode, tanpa driver) — lihat src/input.rs
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  # Audio: WASAPI loopback + render (host/src/audio.rs)
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # NVENC: device D3D11 + texture NV12 (host/src/nvenc.rs)
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Dxgi_Common",
] }
# HTTP kecil untuk tukar token host (GUI native) — rustls, tanpa OpenSSL.
ureq = { version = "2", features = ["json"] }

# ── Fase capture/encode (Windows-only) — aktifkan saat implementasi ──
# windows-capture = "1"              # DXGI Desktop Duplication
# ffmpeg-next = "6"                  # encode NVENC/AMF/QuickSync (jalur cepat PoC)

# Test loopback end-to-end: client (offerer) ↔ Session host (answerer) di
# satu proses. Memakai dependency yang sama dengan binary.
[dev-dependencies]
tokio = { version = "1", features = ["full"] }
webrtc = "0.11"
bytes = "1"
anyhow = "1"

# Kompilasi libopus vendor (Windows-only) — lihat build.rs.
[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
