name: Test Lab (RDP via Tailscale)

# Lab uji fungsional XyDesk host di runner Windows GitHub, diakses via RDP
# melalui Tailscale. BUKAN benchmark latency (CPU virtual, tanpa GPU) —
# gunanya memverifikasi: pairing, video muncul, input/clipboard jalan.

# Cara pakai:
#   1. Set secrets repo: TAILSCALE_AUTHKEY (auth key dari admin Tailscale,
#      disarankan ephemeral+reusable) dan RDP_PASSWORD (password kuat).
#   2. Actions -> "Test Lab" -> Run workflow (isi durasi menit).
#   3. Tunggu step "Info koneksi" menampilkan IP Tailscale runner.
#   4. RDP dari perangkat mana pun di tailnet: user `xydesk`,
#      password = RDP_PASSWORD, alamat = IP Tailscale tersebut.
#      JANGAN login sebagai runneradmin — itu akun milik runner GitHub;
#      mengambil alih sesinya MEMBUNUH job (pelajaran dari lab pertama).
#   5. Di dalam RDP: jalankan XyDesk (sudah terinstal), buka mode Host,
#      catat ID + password, lalu konek dari HP/web seperti biasa.
#   6. Lab berjalan penuh sesuai durasi; hentikan hanya lewat Cancel run.
#
# Catatan: menutup jendela RDP me-lock sesi (capture bisa beku). Untuk
# melepas tanpa lock, jalankan di PowerShell admin DI DALAM sesi RDP:
#   tscon $env:SESSIONNAME /dest:console

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi lab dalam menit (maks 340; batas keras GitHub 6 jam)'
        required: false
        default: '340'

permissions:
  contents: read

jobs:
  lab:
    name: Windows lab
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - name: Validasi secrets
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:TS_AUTHKEY) { Write-Error 'Secret TAILSCALE_AUTHKEY belum diatur.'; exit 1 }
          if (-not $env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 12) {
            Write-Error 'Secret RDP_PASSWORD belum diatur / kurang dari 12 karakter.'; exit 1
          }

      - name: Pasang Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec -ArgumentList '/i',"$env:TEMP\ts.msi",'/quiet','/norestart' -Wait
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey $env:TS_AUTHKEY --hostname 'xydesk-lab' --accept-dns=false
          & 'C:\Program Files\Tailscale\tailscale.exe' ip -4

      - name: Aktifkan RDP (user terpisah — runneradmin TIDAK disentuh)
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          # User RDP TERPISAH. Login sebagai runneradmin mengambil alih sesi
          # console milik proses runner dan MEMATIKAN job — akar matinya lab
          # pertama. Akun xydesk aman: sesi RDP-nya berdiri sendiri.
          net user xydesk $env:RDP_PASSWORD /add /y
          net localgroup Administrators xydesk /add
          net localgroup 'Remote Desktop Users' xydesk /add
          # Anti-lock: biar RDP disconnect tidak langsung hitam (gejala yang
          # dilapor founder: "tersambung tapi hitam, hanya Ms terbaca").
          # Windows Server default: tutup RDP = lock sesi = BitBlt hitam.
          # Solusi operator: set power & screen saver jangan lock, dan sediakan
          # shortcut tscon untuk disconnect tanpa lock.
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop' -Name ScreenSaveActive -Value 0 -ErrorAction SilentlyContinue
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          # Registry: jangan lock saat screensaver (kalau aktif)
          $null = New-Item -Path 'HKCU:\Control Panel\Desktop' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name ScreenSaveActive -Value 0 -ErrorAction SilentlyContinue
          # Buat shortcut di Desktop xydesk: Disconnect tanpa lock
          $desktop = 'C:\Users\xydesk\Desktop'
          if (Test-Path $desktop) {
            $bat = @'
          @echo off
          echo [xydesk-lab] Disconnect RDP tanpa lock — sesi pindah ke console...
          echo Jalankan ini SEBELUM tutup jendela RDP, biar capture tidak beku.
          tscon %SESSIONNAME% /dest:console
          if %errorlevel% neq 0 (
            echo Gagal tscon, coba: tscon RDP-Tcp#0 /dest:console
            tscon RDP-Tcp#0 /dest:console
          )
          echo Selesai. Sekarang aman tutup RDP.
          pause
          '@
            Set-Content -Path "$desktop\Disconnect-tanpa-lock.bat" -Value $bat -Encoding ASCII
            Write-Host "Shortcut Disconnect-tanpa-lock.bat dibuat di $desktop"
          }

      - name: Install Virtual Display Driver (seperti AnyDesk/RustDesk)
        shell: pwsh
        run: |
          Write-Host "=== Install Virtual Display Driver (fix hitam VM/RDP) ===" -ForegroundColor Cyan
          # Coba install via Scoop (IddSampleDriver) — paling ringan untuk runner
          try {
            Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
              Write-Host "Install Scoop..."
              Invoke-Expression (New-Object Net.WebClient).DownloadString('https://get.scoop.sh')
            }
            scoop bucket add extras 2>$null
            scoop install idd-sample-driver -g 2>&1 | Out-String | Write-Host
            Write-Host "IddSampleDriver installed via Scoop" -ForegroundColor Green
          } catch {
            Write-Host "Scoop install gagal: $_" -ForegroundColor Yellow
            Write-Host "Coba download itsmikethetech driver..."
            try {
              $url = "https://github.com/itsmikethetech/Virtual-Display-Driver/releases/latest/download/Virtual-Display-Driver-Setup-v24.12.24.exe"
              $tmp = "$env:TEMP\VDD-Setup.exe"
              Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
              Start-Process $tmp -ArgumentList "/S" -Wait
              Write-Host "VDD installed" -ForegroundColor Green
            } catch {
              Write-Host "VDD install gagal: $_ — akan pakai GDI fallback" -ForegroundColor Yellow
            }
          }
          # Cek driver
          Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Format-Table FriendlyName, InstanceId, Status
          Write-Host "Virtual display driver step selesai — XyDesk v6.7.1+ akan deteksi via virtual_display.rs" -ForegroundColor Cyan

      - name: Diagnostik prasyarat runtime + virtual devices untuk VM
        shell: pwsh
        run: |
          # Flutter Windows + flutter_webrtc butuh beberapa DLL yang di
          # Windows SERVER (runner) bisa jadi tidak ada. Cek semua di muka.
          $checks = @(
            'C:\Windows\System32\mfplat.dll',      # Media Foundation
            'C:\Windows\System32\mf.dll',
            'C:\Windows\System32\msvcp140.dll',    # VC++ runtime
            'C:\Windows\System32\vcruntime140.dll',
            'C:\Windows\System32\d3d11.dll'
          )
          foreach ($f in $checks) {
            $ada = Test-Path $f
            Write-Host ("{0} : {1}" -f $f, $(if ($ada) {'ADA'} else {'HILANG'}))
          }
          # Media Foundation adalah fitur opsional di Server. Coba pasang
          # bila hilang (tanpa restart; dicatat bila butuh restart).
          if (-not (Test-Path 'C:\Windows\System32\mfplat.dll')) {
            Write-Host 'Memasang fitur Server-Media-Foundation...'
            $r = Install-WindowsFeature Server-Media-Foundation
            Write-Host ("Hasil: Success={0} RestartNeeded={1}" -f $r.Success, $r.RestartNeeded)
          }
          # Audio VM: runner Windows Server tidak punya sound card — WASAPI
          # loopback akan selalu gagal (gejala "driver audio/mic mati").
          # Coba enable Windows Audio service, dan catat untuk operator.
          Write-Host '--- Audio service ---'
          Get-Service Audiosrv | Format-List Name,Status,StartType
          try { Start-Service Audiosrv -ErrorAction Stop; Write-Host 'Audiosrv started' } catch { Write-Host "Audiosrv start gagal: $_" }
          # Deteksi RDP session (akar hitam di lab)
          $isRdp = [System.Windows.Forms.SystemInformation]::TerminalServerSession
          Add-Type -AssemblyName System.Windows.Forms -ErrorAction SilentlyContinue
          Write-Host "Is RDP session (current shell): $isRdp"
          Write-Host 'SM_REMOTESESSION via GetSystemMetrics akan dicek host Rust v6.7.1+ (log GDI fallback)'
          # Catatan untuk XyDesk host v6.7.1+:
          # - GDI fallback GetDC(0) + virtual screen sudah aktif — jadi RDP tetap bisa capture RDP desktop
          # - DXGI fallback output pertama aktif — VM tanpa DISPLAY tetap dapat frame
          # - audio capture_available sekarang cek device beneran, bukan cfg
          # Tapi: tutup RDP = lock = hitam total (BitBlt 0). Harus tscon /dest:console

      - name: Info koneksi
        shell: pwsh
        run: |
          $ip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4).Trim()
          Write-Host '=========================================='
          Write-Host " RDP  : $ip  (user: xydesk — BUKAN runneradmin!)"
          Write-Host ' Pass : secret RDP_PASSWORD'
          Write-Host ' App  : XyDesk (Start Menu) -> mode Host'
          Write-Host '=========================================='
          Write-Host ''
          Write-Host ' PENTING — KENAPA HITAM KALAU TES LEWAT RDP:'
          Write-Host ' - RDP menutup = sesi lock = BitBlt hitam (Windows security)'
          Write-Host ' - DXGI Desktop Duplication TIDAK jalan di RDP session'
          Write-Host ' - Solusi: setelah setup XyDesk di RDP, JANGAN tutup RDP langsung.'
          Write-Host '   Jalankan di dalam RDP: Disconnect-tanpa-lock.bat di Desktop'
          Write-Host '   Atau PowerShell: tscon $env:SESSIONNAME /dest:console'
          Write-Host '   Lalu konek via XyDesk (bukan RDP) untuk tes capture beneran.'
          Write-Host ' - Audio: runner tidak punya sound card, WASAPI loopback mati wajar.'
          Write-Host '   Fix v6.7.1+ sudah deteksi device beneran, tidak bohong "tersedia".'
          Write-Host ' - Virtual Display Driver: sudah di-install via Scoop (IddSampleDriver) seperti AnyDesk'
          Write-Host '   XyDesk v6.7.2+ deteksi via virtual_display.rs: needed/installed/isAdmin di /status'
          Write-Host '=========================================='
          "## XyDesk Test Lab`n`n- RDP: ``$ip`` user ``xydesk```n- Durasi: ${{ inputs.duration }} menit`n`n### Kenapa hitam kalau tes lewat RDP?`n- Tutup RDP = lock sesi = capture hitam (BitBlt 0).`n- DXGI tidak jalan di RDP.`n- Fix v6.7.1+: GDI fallback GetDC(0) + DXGI fallback output pertama.`n- Fix v6.7.2+: Virtual Display Driver (seperti AnyDesk) di-install otomatis via Scoop, deteksi di Beranda.`n- Cara tes benar: setup XyDesk di RDP, lalu `tscon `$env:SESSIONNAME /dest:console` (atau klik `Disconnect-tanpa-lock.bat` di Desktop), baru konek via XyDesk, bukan RDP.`n`n### Audio mati?`n- Runner Server tidak punya sound card, wajar. v6.7.1+ sekarang jujur: captureAvailable=false kalau tidak ada device.`n`n### Virtual Display (AnyDesk-style)?`n- Driver IddSampleDriver di-install otomatis, cek Device Manager -> Display adapters.`n- XyDesk Host -> Beranda -> Virtual Display Driver: installed=true berarti driver ada.`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Tahan runner selama durasi lab
        shell: pwsh
        run: |
          # Tanpa mekanisme stop apa pun (permintaan owner): lab berjalan
          # penuh sesuai durasi. Hentikan hanya lewat Cancel run di UI.
          $minutes = [Math]::Min([int]'${{ inputs.duration }}', 340)
          $deadline = (Get-Date).AddMinutes($minutes)
          Write-Host "Lab aktif sampai $deadline."
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
          }

      - name: Putus Tailscale
        if: always()
        shell: pwsh
        run: |
          & 'C:\Program Files\Tailscale\tailscale.exe' logout
          Write-Host 'Node lab keluar dari tailnet.'
