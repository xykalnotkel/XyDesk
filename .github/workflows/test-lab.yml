name: Test Lab (RDP via Tailscale)

# Lab uji fungsional XyDesk host di runner Windows GitHub, diakses via RDP
# melalui Tailscale. BUKAN benchmark latency (CPU virtual, tanpa GPU) —
# gunanya memverifikasi: pairing, video muncul, input/clipboard jalan.
#
# Cara pakai:
#   1. Set secrets repo: TAILSCALE_AUTHKEY (auth key dari admin Tailscale,
#      disarankan ephemeral+reusable) dan RDP_PASSWORD (password kuat).
#   2. Actions -> "Test Lab" -> Run workflow (isi durasi menit).
#   3. Tunggu step "Info koneksi" menampilkan IP Tailscale runner.
#   4. RDP dari perangkat mana pun di tailnet: user `xydesk`,
#      password = RDP_PASSWORD, alamat = IP Tailscale tersebut.
#      JANGAN login sebagai runneradmin — itu akun milik runner GitHub;
#      mengambil alih sesinya MEMBUNUH job (pelajaran dari lab pertama).
#   5. Di dalam RDP: jalankan XyDesk (sudah terinstal), buka mode Host,
#      catat ID + password, lalu konek dari HP/web seperti biasa.
#   6. Lab berjalan penuh sesuai durasi; hentikan hanya lewat Cancel run.
#
# Catatan: menutup jendela RDP me-lock sesi (capture bisa beku). Untuk
# melepas tanpa lock, jalankan di PowerShell admin DI DALAM sesi RDP:
#   tscon $env:SESSIONNAME /dest:console

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi lab dalam menit (maks 340; batas keras GitHub 6 jam)'
        required: false
        default: '340'

permissions:
  contents: read

jobs:
  lab:
    name: Windows lab
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - name: Validasi secrets
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:TS_AUTHKEY) { Write-Error 'Secret TAILSCALE_AUTHKEY belum diatur.'; exit 1 }
          if (-not $env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 12) {
            Write-Error 'Secret RDP_PASSWORD belum diatur / kurang dari 12 karakter.'; exit 1
          }

      - name: Pasang Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec -ArgumentList '/i',"$env:TEMP\ts.msi",'/quiet','/norestart' -Wait
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey $env:TS_AUTHKEY --hostname 'xydesk-lab' --accept-dns=false
          & 'C:\Program Files\Tailscale\tailscale.exe' ip -4

      - name: Aktifkan RDP (user terpisah — runneradmin TIDAK disentuh)
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          # User RDP TERPISAH. Login sebagai runneradmin mengambil alih sesi
          # console milik proses runner dan MEMATIKAN job — akar matinya lab
          # pertama. Akun xydesk aman: sesi RDP-nya berdiri sendiri.
          net user xydesk $env:RDP_PASSWORD /add /y
          net localgroup Administrators xydesk /add
          net localgroup 'Remote Desktop Users' xydesk /add

      - name: Diagnostik prasyarat runtime
        shell: pwsh
        run: |
          # Flutter Windows + flutter_webrtc butuh beberapa DLL yang di
          # Windows SERVER (runner) bisa jadi tidak ada. Cek semua di muka.
          $checks = @(
            'C:\Windows\System32\mfplat.dll',      # Media Foundation
            'C:\Windows\System32\mf.dll',
            'C:\Windows\System32\msvcp140.dll',    # VC++ runtime
            'C:\Windows\System32\vcruntime140.dll',
            'C:\Windows\System32\d3d11.dll'
          )
          foreach ($f in $checks) {
            $ada = Test-Path $f
            Write-Host ("{0} : {1}" -f $f, $(if ($ada) {'ADA'} else {'HILANG'}))
          }
          # Media Foundation adalah fitur opsional di Server. Coba pasang
          # bila hilang (tanpa restart; dicatat bila butuh restart).
          if (-not (Test-Path 'C:\Windows\System32\mfplat.dll')) {
            Write-Host 'Memasang fitur Server-Media-Foundation...'
            $r = Install-WindowsFeature Server-Media-Foundation
            Write-Host ("Hasil: Success={0} RestartNeeded={1}" -f $r.Success, $r.RestartNeeded)
          }

      - name: Info koneksi
        shell: pwsh
        run: |
          $ip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4).Trim()
          Write-Host '=========================================='
          Write-Host " RDP  : $ip  (user: xydesk — BUKAN runneradmin!)"
          Write-Host ' Pass : secret RDP_PASSWORD'
          Write-Host ' App  : XyDesk (Start Menu) -> mode Host'
          Write-Host '=========================================='
          "## XyDesk Test Lab`n`n- RDP: ``$ip`` user ``xydesk```n- Durasi: ${{ inputs.duration }} menit" >> $env:GITHUB_STEP_SUMMARY

      - name: Tahan runner selama durasi lab
        shell: pwsh
        run: |
          # Tanpa mekanisme stop apa pun (permintaan owner): lab berjalan
          # penuh sesuai durasi. Hentikan hanya lewat Cancel run di UI.
          $minutes = [Math]::Min([int]'${{ inputs.duration }}', 340)
          $deadline = (Get-Date).AddMinutes($minutes)
          Write-Host "Lab aktif sampai $deadline."
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
          }

      - name: Putus Tailscale
        if: always()
        shell: pwsh
        run: |
          & 'C:\Program Files\Tailscale\tailscale.exe' logout
          Write-Host 'Node lab keluar dari tailnet.'
