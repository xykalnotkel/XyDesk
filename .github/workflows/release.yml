name: Release

# Release stabil dibuat hanya setelah workflow Build pada main sukses.
# Perubahan versi di pubspec.yaml (contoh 1.1.0+3) menjadi tag v1.1.0.
# Jika tag/release untuk versi itu sudah ada, workflow berhenti tanpa duplikasi.
on:
  workflow_run:
    workflows: ['Build']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'
  ONESIGNAL_APP_ID: 'e3d5adea-1c0f-4986-9ce5-e088d65f0998'

jobs:
  prepare:
    name: Validasi versi
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: release
        name: Cocokkan pubspec dan Build
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          release_sha="${WORKFLOW_SHA:-$GITHUB_SHA}"

          version_full="$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)"
          if ! [[ "$version_full" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo "::error::version pubspec harus berbentuk SemVer+build, contoh 1.1.0+3"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          tag="v$version"

          # Keberadaan tag adalah penanda bahwa nilai version ini sudah dirilis.
          # Ini tetap mengizinkan commit perbaikan setelah Build versi baru gagal.
          # Pengecualian — RILIS ULANG (pelajaran 3 Sep 2026): bila tag sudah
          # ada tetapi build number pubspec LEBIH TINGGI dari build number pada
          # update.json yang sudah terbit, rilis ulang diizinkan (aset rilis
          # ditimpa + notifikasi baru). Tanpa ini, rilis yang ditarik lalu
          # diterbitkan ulang dengan build yang sama membuat aplikasi menolak
          # pembaruan selamanya ("Build yang terpasang sudah sama atau lebih
          # baru dari Release resmi saat ini") — persis yang dialami pengguna
          # 6.3.0 build 25 hari ini.
          re_release=false
          existing_build=0
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" \
            >/dev/null 2>&1; then
            existing_url="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
                --jq '.assets[] | select(.name == "update.json") | .browser_download_url' \
                2>/dev/null || true
            )"
            if [ -n "$existing_url" ]; then
              existing_build="$(
                curl -fsSL "$existing_url" 2>/dev/null \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build", 0))' \
                  2>/dev/null || echo 0
              )"
            fi
            if [ "$existing_build" -lt "$build_number" ] 2>/dev/null; then
              echo "Tag $tag sudah ada (update.json build $existing_build) — rilis ulang ke build $build_number."
              re_release=true
            else
              echo "Tag $tag sudah ada (build $existing_build) dan build pubspec ($build_number) tidak lebih tinggi; tidak membuat Release duplikat."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          build_run_id="${WORKFLOW_RUN_ID:-}"
          if [ -z "$build_run_id" ]; then
            build_run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow build.yml \
                --commit "$release_sha" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
          fi
          if [ -z "$build_run_id" ]; then
            echo "::error::Build sukses untuk $release_sha tidak ditemukan."
            exit 1
          fi
          # Build kini difilter per area (build.yml): run untuk commit
          # "papan/dokumen" TIDAK memuat artefak client — kalau rilis tetap
          # jalan, `gh run download` gagal BlobNotFound dan run jadi merah
          # (terjadi 3 Sep 2026). Wajib cek artefak yang dibutuhkan; kalau
          # belum ada, rilis dilewati dengan tenang dan akan jalan pada
          # Build penuh (commit bump versi / workflow_dispatch).
          artifact_names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run_id/artifacts" \
            --jq '.artifacts[].name')"
          for required in XyDesk-Android-APK XyDesk-Windows-x64 XyDesk-Windows-arm64; do
            if ! echo "$artifact_names" | grep -qx "$required"; then
              echo "::warning::Build run $build_run_id tidak memuat artefak $required — run itu build terfilter, bukan bump versi/penuh. Rilis dilewati; akan jalan kala Build penuh sukses."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run_id" \
              --jq '.conclusion'
          )"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Build run $build_run_id belum sukses ($conclusion)."
            exit 1
          fi

          {
            echo "should_release=true"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "tag=$tag"
            echo "release_sha=$release_sha"
            echo "build_run_id=$build_run_id"
            echo "re_release=$re_release"
          } >> "$GITHUB_OUTPUT"
          echo "Siap merilis $tag (build $build_number) dari $release_sha."

  clients:
    name: Ambil build client yang sudah lulus
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Unduh artefak Build terverifikasi
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ needs.prepare.outputs.build_run_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/android incoming/windows-x64 incoming/windows-arm64 dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name XyDesk-Android-APK --dir incoming/android
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name XyDesk-Windows-x64 --dir incoming/windows-x64
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name XyDesk-Windows-arm64 --dir incoming/windows-arm64
          cp incoming/android/XyDesk-Android-arm64-v8a.apk dist/
          cp incoming/android/XyDesk-Android-armeabi-v7a.apk dist/
          # Aplikasi Windows dibungkus zip HANYA sebagai bahan installer;
          # zip ini tidak diterbitkan sebagai aset rilis.
          (cd incoming/windows-x64 && zip -q -r ../../dist/app-windows-x64.zip .)
          (cd incoming/windows-arm64 && zip -q -r ../../dist/app-windows-arm64.zip .)
          test -s dist/XyDesk-Android-arm64-v8a.apk
          test -s dist/XyDesk-Android-armeabi-v7a.apk
          test -s dist/app-windows-x64.zip
          test -s dist/app-windows-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-client-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  windows-installer:
    name: Installer Windows ${{ matrix.arch }}
    needs: [prepare, clients]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-client-assets
          path: incoming/clients
      - name: Satukan aplikasi dan engine Host
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "xydesk-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          # Artefak Windows kini: shell Electron (XyDesk.exe) + engine Rust
          # yang dibundel electron-builder ke resources/engine/xydesk-host.exe.
          # GUI native Win32 tidak lagi dikemas.
          Expand-Archive "incoming/clients/app-windows-${{ matrix.arch }}.zip" $bundle
          if (-not (Test-Path "$bundle/XyDesk.exe")) { throw "XyDesk.exe tidak ada di bundle" }
          if (-not (Test-Path "$bundle/resources/engine/xydesk-host.exe")) {
            throw "engine tidak dibundel (resources/engine/xydesk-host.exe hilang)"
          }
          "BUNDLE_PATH=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundle driver VDD untuk installer (opt-in)
        shell: pwsh
        run: |
          $bundle = $env:BUNDLE_PATH
          if (-not $bundle -or -not (Test-Path $bundle)) {
            Write-Host "[SKIP] BUNDLE_PATH tidak set; skip driver VDD."
            exit 0
          }
          $driverRoot = Join-Path $bundle "drivers"
          $driverIDD = Join-Path $driverRoot "IddSampleDriver"
          New-Item -ItemType Directory -Force -Path $driverIDD | Out-Null

          # INF upstream hanya mendeklarasikan [Standard.NTamd64] — driver ini
          # tidak berlaku di Windows on Arm. Jangan paketkan di installer arm64.
          if ("${{ matrix.arch }}" -ne "x64") {
            Write-Host "[SKIP] VDD hanya untuk x64; arch=${{ matrix.arch }}."
            exit 0
          }

          # Tag rilis ge9/IddSampleDriver TIDAK memakai awalan "v".
          # URL lama (v0.0.1.4) selalu 404 dan try/catch menelannya diam-diam.
          $hasDriver = $false
          $iddZip = "$env:RUNNER_TEMP\idd.zip"
          $urls = @(
            "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.4/IddSampleDriver.zip",
            "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.3/IddSampleDriver.zip"
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $iddZip -UseBasicParsing -ErrorAction Stop
              # Zip berisi folder bersarang IddSampleDriver/ dengan berkas
              # huruf kecil. Ekstrak ke induk lalu ratakan.
              $stage = Join-Path $env:RUNNER_TEMP "idd-stage"
              Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive $iddZip -DestinationPath $stage -Force
              $inner = Join-Path $stage "IddSampleDriver"
              if (Test-Path $inner) {
                Copy-Item "$inner\*" $driverIDD -Recurse -Force
              } else {
                Copy-Item "$stage\*" $driverIDD -Recurse -Force
              }
              $hasDriver = $true; break
            } catch {
              Write-Host "[WARN] Gagal unduh $u : $($_.Exception.Message)"
            }
          }
          # Unduhan gagal = bug (URL/tag salah), bukan kondisi normal.
          if (-not $hasDriver) {
            Write-Host "::error::Driver VDD gagal diunduh dari semua URL."
            exit 1
          }
          # Buktikan berkas yang dicari install.bat memang ada.
          foreach ($need in @("iddsampledriver.inf", "iddsampledriver.cer")) {
            if (-not (Test-Path (Join-Path $driverIDD $need))) {
              Write-Host "::error::Berkas driver $need tidak ditemukan setelah ekstraksi."
              Get-ChildItem $driverIDD | ForEach-Object { Write-Host "  ada: $($_.Name)" }
              exit 1
            }
          }
          Write-Host "[OK] Driver VDD siap (x64)."


          $copy = @(
            @{ src = "packaging/windows/drivers/IddSampleDriver/install.bat";   dst = "IddSampleDriver/install.bat" },
            @{ src = "packaging/windows/drivers/IddSampleDriver/uninstall.bat"; dst = "IddSampleDriver/uninstall.bat" },
            @{ src = "packaging/windows/drivers/IddSampleDriver/option.txt";    dst = "IddSampleDriver/option.txt" },
            @{ src = "packaging/windows/drivers/license-ge9.txt";                dst = "license-ge9.txt" },
            @{ src = "packaging/windows/drivers/README-VDD.txt";                dst = "README-VDD.txt" }
          )
          foreach ($s in $copy) {
            if (Test-Path $s.src) {
              Copy-Item $s.src (Join-Path $driverRoot $s.dst) -Force
            }
          }
          Write-Host "[OK] Bundle driver siap."
      - name: Pasang Inno Setup stabil
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build satu installer EXE utuh
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "installer-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $iscc = Get-ChildItem "C:\Program Files (x86)" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe tidak ditemukan" }
          Write-Host "Memakai compiler: $iscc"
          & $iscc `
            "/DArch=${{ matrix.arch }}" `
            "/DVersion=$env:VERSION" `
            "/DSourceDir=$env:BUNDLE_PATH" `
            "/DOutputDir=$out" `
            "packaging/windows/XyDesk.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup gagal: $LASTEXITCODE" }
          "INSTALLER_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ matrix.arch }}
          path: ${{ env.INSTALLER_OUT }}/*.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Terbitkan Release dan push update
    needs: [prepare, clients, windows-installer]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validasi secret push sebelum publikasi
        run: |
          if [ -z "$ONESIGNAL_REST_API_KEY" ]; then
            echo "::error::GitHub Secret ONESIGNAL_REST_API_KEY belum diatur. Release tidak dipublikasikan."
            exit 1
          fi

      - name: Kumpulkan aset, banner, checksum, dan manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/release-client-assets/XyDesk-Android-arm64-v8a.apk dist/
          cp artifacts/release-client-assets/XyDesk-Android-armeabi-v7a.apk dist/
          # Changelog rilis ikut dilampirkan — wajib ada di setiap rilis.
          cp CHANGELOG.md dist/CHANGELOG.md
          # Satu installer per arsitektur. Client Flutter + engine Rust Host
          # sudah menyatu di dalamnya, jadi host exe & portable zip tidak
          # diterbitkan terpisah.
          cp artifacts/release-installer-x64/XyDesk-x64.exe dist/
          cp artifacts/release-installer-arm64/XyDesk-arm64.exe dist/
          # Banner dirender ulang setiap rilis: versi, build, dan tanggal
          # ditulis otomatis di atas art dasar HD (tool/art/banner.py).
          pip install --quiet Pillow
          python3 tool/art/banner.py \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --out dist/xydesk_update_banner_1024x512.jpg
          test -s dist/XyDesk-Android-arm64-v8a.apk
          test -s dist/XyDesk-Android-armeabi-v7a.apk
          cd dist
          sha256sum XyDesk-Android-arm64-v8a.apk \
            XyDesk-Android-armeabi-v7a.apk \
            XyDesk-x64.exe XyDesk-arm64.exe \
            xydesk_update_banner_1024x512.jpg \
            > SHA256SUMS.txt
          arm64_sha="$(sha256sum XyDesk-Android-arm64-v8a.apk | cut -d' ' -f1)"
          arm64_bytes="$(stat -c%s XyDesk-Android-arm64-v8a.apk)"
          armv7_sha="$(sha256sum XyDesk-Android-armeabi-v7a.apk | cut -d' ' -f1)"
          armv7_bytes="$(stat -c%s XyDesk-Android-armeabi-v7a.apk)"
          export arm64_sha arm64_bytes armv7_sha armv7_bytes
          python3 - <<'PY'
          import json, os
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          version = os.environ['VERSION']
          build = int(os.environ['BUILD_NUMBER'])
          base = f"https://github.com/{repository}/releases/download/{tag}"
          manifest = {
              "schema": 2,
              "version": version,
              "build": build,
              "tag": tag,
              "title": "XyDesk Update!! Cek Sekarang",
              "summary": (
                  f"XyDesk {version} sudah tersedia dengan peningkatan "
                  "pengalaman, stabilitas, dan keamanan pembaruan."
              ),
              "notes": [
                  "Penyempurnaan pengalaman XyDesk dan tampilan Session.",
                  "Pembaruan resmi terverifikasi dengan checksum SHA-256.",
                  "Detail lengkap tersedia di catatan GitHub Release resmi."
              ],
              "apks": {
                  "arm64-v8a": {
                      "url": f"{base}/XyDesk-Android-arm64-v8a.apk",
                      "sha256": os.environ["arm64_sha"],
                      "bytes": int(os.environ["arm64_bytes"]),
                  },
                  "armeabi-v7a": {
                      "url": f"{base}/XyDesk-Android-armeabi-v7a.apk",
                      "sha256": os.environ["armv7_sha"],
                      "bytes": int(os.environ["armv7_bytes"]),
                  },
              },
              "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "banner_url": f"{base}/xydesk_update_banner_1024x512.jpg",
          }
          with open("update.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, separators=(",", ":"))
              handle.write("\n")
          PY
          python3 -m json.tool update.json >/dev/null
          sha256sum update.json >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Hapus aset rilis lama (mode rilis ulang)
        if: needs.prepare.outputs.re_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in \
            CHANGELOG.md SHA256SUMS.txt update.json \
            XyDesk-Android-arm64-v8a.apk XyDesk-Android-armeabi-v7a.apk \
            XyDesk-x64.exe XyDesk-arm64.exe \
            xydesk_update_banner_1024x512.jpg
          do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes 2>/dev/null || true
          done

      - name: Siapkan isi changelog untuk Release
        run: |
          {
            echo 'CHANGELOG_BODY<<EOF'
            sed -n '/^## \[/,$p' CHANGELOG.md | head -n 120
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Publikasikan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.release_sha }}
          files: dist/*
          fail_on_unmatched_files: true
          update_release: true
          generate_release_notes: true
          body: |
            ## XyDesk ${{ needs.prepare.outputs.tag }}

            Rilis resmi XyDesk untuk Android, Windows, dan Web.

            ${{ env.CHANGELOG_BODY }}

            | Platform | Berkas | Keterangan |
            |---|---|---|
            | Windows Intel/AMD | `XyDesk-x64.exe` | Kebanyakan PC & laptop |
            | Windows Arm | `XyDesk-arm64.exe` | Snapdragon / Windows on Arm |
            | Android 64-bit | `XyDesk-Android-arm64-v8a.apk` | HP Android modern |
            | Android 32-bit | `XyDesk-Android-armeabi-v7a.apk` | Perangkat ARMv7 lama |

            Installer Windows sudah memuat aplikasi dan engine Host sekaligus —
            tidak ada berkas terpisah yang perlu diunduh. Client web tersedia
            online di https://app.xystudio.my.id

            XyDesk memverifikasi APK menggunakan metadata `update.json`,
            checksum SHA-256, package ID, dan sertifikat signing sebelum installer dibuka.

            > APK ditandatangani dengan keystore rilis. Windows EXE belum
            > code-signed sehingga SmartScreen dapat menampilkan peringatan.

      - name: Kirim OneSignal hanya ke build Android lama
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, uuid
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          version = os.environ['VERSION']
          build = os.environ['BUILD_NUMBER']
          base = f"https://github.com/{repository}/releases/download/{tag}"
          payload = {
              "app_id": os.environ["ONESIGNAL_APP_ID"],
              "target_channel": "push",
              "isAndroid": True,
              # Saat rilis baru terbit, semua subscriber masih berada pada
              # build lama. Segment resmi lebih andal daripada membandingkan
              # app_version string dengan Android versionCode integer.
              "included_segments": ["Subscribed Users"],
              "headings": {
                  "en": "XyDesk Update!! Cek Sekarang",
                  "id": "XyDesk Update!! Cek Sekarang",
              },
              "contents": {
                  "en": f"Versi {version} sudah tersedia. Lihat detail pembaruan di XyDesk.",
                  "id": f"Versi {version} sudah tersedia. Lihat detail pembaruan di XyDesk.",
              },
              "data": {
                  "route": "app_update",
                  "version": version,
                  "build": build,
                  "title": "XyDesk Update!! Cek Sekarang",
                  "summary": f"Versi {version} sudah tersedia untuk diunduh dan dipasang.",
                  "notes": [
                      "Penyempurnaan pengalaman dan stabilitas XyDesk.",
                      "APK resmi diverifikasi sebelum pemasangan."
                  ],
              },
              "big_picture": f"{base}/xydesk_update_banner_1024x512.jpg",
              "name": f"XyDesk release {tag}",
              # Sertakan build number: rilis ulang dengan tag yang sama (mis.
              # build 25 → 26) HARUS tetap mengirim notifikasi — tanpa build
              # di key, OneSignal menolak duplikat dan pengguna build lama
              # tidak pernah tahu ada pembaruan.
              "idempotency_key": str(uuid.UUID(
                  bytes=uuid.uuid5(uuid.NAMESPACE_URL, f"xydesk:{tag}:{build}").bytes,
                  version=4,
              )),
          }
          with open('/tmp/onesignal-payload.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False)
          PY
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --url 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              --data-binary @/tmp/onesignal-payload.json
          )"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::OneSignal menolak push update (HTTP $status)."
            python3 - <<'PY' "$response_file"
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding='utf-8'))
              print(json.dumps({k: data[k] for k in ('errors', 'warnings') if k in data}))
          except Exception:
              print('Respons OneSignal tidak dapat dibaca.')
          PY
            exit 1
          fi
          # OneSignal menjawab 200 dengan id kosong bila segmen tujuan kosong.
          # Ini pernah membuat tiga rilis berturut-turut terbit tanpa satu pun
          # notifikasi: perangkat sudah memberi izin di Android, tapi belum
          # opt-in di SDK sehingga tidak masuk segmen "Subscribed Users".
          # Aplikasi 6.2.2 sudah opt-in otomatis; percobaan kedua di bawah
          # menyelamatkan pemasangan lama yang belum diperbarui.
          if python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if not d.get('id') else 1)" "$response_file"; then
            echo "::warning::Segmen Subscribed Users kosong. Mencoba ulang ke seluruh langganan."
            python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/onesignal-payload.json', encoding='utf-8'))
          payload['included_segments'] = ['Total Subscriptions']
          payload.pop('idempotency_key', None)
          json.dump(payload, open('/tmp/onesignal-retry.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
            retry_file="$(mktemp)"
            curl --silent --show-error \
              --output "$retry_file" \
              --request POST \
              --url 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              --data-binary @/tmp/onesignal-retry.json
            response_file="$retry_file"
          fi
          python3 - <<'PY' "$response_file"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if not data.get('id'):
              print('::warning::Push tidak terkirim: tidak ada perangkat yang '
                    'bisa dihubungi. '
                    f"Respons: {json.dumps(data, ensure_ascii=False)}")
          else:
              print(f"Push OneSignal dibuat: id={data.get('id')} "
                    f"recipients={data.get('recipients')}")
          PY
