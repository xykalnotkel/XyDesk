name: Release

# Jalan saat tag versi didorong:  git tag v0.1.0 && git push origin v0.1.0
# ATAU manual (workflow_dispatch). Menghasilkan rilis multi-platform:
#   - Android APK (universal)
#   - Windows EXE (host — dipasang di PC yang dikendalikan)
#   - Web (untuk user iPhone / yang tak mau install — client via browser)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  android:
    name: APK Universal (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Siapkan signing APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 kosong — lewati signing rilis (fallback debug)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/xydesk-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=xydesk-release.keystore
          EOF
      - run: >-
          flutter build apk --release
          --target-platform=android-arm,android-arm64
          --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Siapkan artefak
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XyDesk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-APK
          path: dist/XyDesk.apk

  windows-host:
    name: Host EXE (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: ${{ runner.os }}-cargo-rel-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rel-
      - name: Build release
        working-directory: host
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Host-Windows
          path: host/target/release/xydesk-host.exe

  web:
    name: Web Client (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create . --platforms=web
      - run: flutter pub get
      - run: flutter build web --release --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Arsipkan web
        run: |
          cd build/web && zip -r ../../XyDesk-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Web
          path: XyDesk-Web.zip

  publish:
    name: Terbitkan Release
    needs: [android, windows-host, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Kumpulkan & buat checksum
        run: |
          mkdir -p dist
          cp artifacts/XyDesk-Android-APK/XyDesk.apk dist/XyDesk.apk 2>/dev/null || true
          cp artifacts/XyDesk-Host-Windows/xydesk-host.exe dist/XyDesk-Host.exe 2>/dev/null || true
          cp artifacts/XyDesk-Web/XyDesk-Web.zip dist/XyDesk-Web.zip 2>/dev/null || true
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## XyDesk ${{ github.ref_name }}

            Aplikasi remote desktop low-latency untuk gaming dan kerja.
            Tanpa VM/VPS, backend di Cloudflare (gratis).

            | Platform | Berkas | Keterangan |
            |---|---|---|
            | Android | `XyDesk.apk` | Universal — HP Android 8.0+ |
            | Windows | `XyDesk-Host.exe` | Host — dipasang di PC yang dikendalikan |
            | Web | `XyDesk-Web.zip` | Client browser (iPhone / tanpa install) |

            Verifikasi unduhan dengan `SHA256SUMS.txt`.

            > APK ditandatangani (keystore rilis). Windows EXE belum code-signed
            > (SmartScreen akan menampilkan peringatan "penerbit tidak dikenal").
