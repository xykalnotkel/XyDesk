name: Release

# Jalan saat tag versi didorong:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android:
    name: APK Universal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Siapkan artefak
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XyDesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: dist/*

  publish:
    name: Terbitkan Release
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Kumpulkan & buat checksum
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## XyDesk ${{ github.ref_name }}

            Aplikasi remote desktop low-latency untuk gaming dan kerja.

            | Platform | Berkas | Cara pakai |
            |---|---|---|
            | Android | `XyDesk.apk` | Universal — jalan di semua HP Android 8.0+ |

            Verifikasi unduhan dengan `SHA256SUMS.txt`.

            > Build Android ini **belum ditandatangani**. Android akan
            > menampilkan peringatan "sumber tidak dikenal". Ini wajar untuk
            > rilis mockup tanpa sertifikat produksi.
