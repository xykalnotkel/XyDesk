name: Build APK Android Native

# Jalur APK yang bisa langsung diuji pengguna. Produk Android dibangun dari
# android-native Kotlin/Compose/JNI; tidak ada Flutter atau libflutter.so.
# Workflow ini hanya menghasilkan artifact debug dan tidak membuat release.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-native:
    name: Build APK Native Kotlin + JNI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-license: true

      - name: Pasang Android SDK, NDK, dan CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Uji unit Kotlin
        run: gradle -p android-native test

      - name: Build APK native debug
        run: gradle -p android-native assembleDebug

      - name: Verifikasi package, ABI, dan tidak ada Flutter
        shell: bash
        run: |
          set -euo pipefail
          apk="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a; do
            for library in libxydesk_streamer.so libxydesk_audio.so libxydesk_control.so libxydesk_bridge.so libjingle_peerconnection_so.so; do
              if ! unzip -l "$apk" | grep -q "lib/$abi/$library"; then
                echo "Library wajib hilang: $abi/$library"
                exit 1
              fi
            done
          done
          if unzip -l "$apk" | grep -E 'lib/(x86|x86_64)/|libflutter\.so|libapp\.so|libstreamer\.so'; then
            echo "ABI x86, runtime Flutter, atau libstreamer.so proprietary ditemukan di APK native."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/XyDesk-Android-Native-debug.apk
          unzip -l "$apk" | grep -E 'classes[0-9]*\.dex|AndroidManifest.xml' | head
          ls -lh dist/XyDesk-Android-Native-debug.apk

      - name: Upload APK native untuk uji perangkat
        uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-Native-debug-${{ github.sha }}
          path: dist/XyDesk-Android-Native-debug.apk
          retention-days: 14
          if-no-files-found: error
