name: Verifikasi Izin Push

# Gerbang IZIN PUSH ke main.
#
# Latar belakang: sejak AGENT.md mewajibkan "izin dulu sebelum push" (3 Sep
# 2026), setiap push ke main WAJIB membawa bukti persetujuan operator di
# `AGENT_BOARD.md`. Workflow ini MEMERIKSA bukti itu, sehingga:
#
#   - pelanggaran langsung terlihat merah di tab Actions (audit otomatis),
#   - kalau diaktifkan sebagai *required status check* di branch protection
#     (atau push lewat PR dengan check ini diwajibkan), pelanggaran menjadi
#     HARD GATE: push tanpa izin benar-benar ditolak sistem.
#
# Persetujuan berbentuk baris "DISETUJUI" untuk ID sesi di AGENT_BOARD.md,
# dan setiap commit agent memuat penanda di body commit:
#
#     Izin: SESI-<YYYYMMDD>-<NAMA>-<AREA>
#
# Contoh:  SESI-20260903-CAKRA-CI
#
# Yang DIKECUALIKAN (bukan tanpa izin, memang operator):
#   1. Commit "Merge pull request ..." — merge PR adalah tindakan operator
#      sendiri, dianggap izin.
#   2. Commit yang ditulis operator (variabel repo `OPERATOR_LOGIN`, mis.
#      `xykalnotkel`) — operator tidak perlu meminta izin ke dirinya sendiri.
#      Set variabel ini di Settings → Secrets and variables → Actions →
#      Variables. Kalau tidak diset, SEMUA push wajib punya persetujuan.
#
# Catatan alur persetujuan (ringkas): agent menulis ID sesi + ringkasan ke
# antrean izin di AGENT_BOARD.md (status MENUNGGU) atau menyampaikannya di
# chat dengan operator → operator mengubah status menjadi DISETUJUI (commit
# kecil di main) → agent push dengan `Izin: <ID>` di body commit.
#
# Untuk alur PR: commit feature branch tetap diperiksa (masuk rentang
# push merge). Tulis `Izin: <ID>` di body commit biasa; kalau squash merge,
# taruh di isi/deskripsi PR karena itu yang menjadi body commit squash.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Periksa izin push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kumpulkan penanda izin dari commit push ini
        id: scan
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            range="$after"
          else
            range="$before..$after"
          fi
          echo "Rentang commit: ${range}"
          git log --format='%H%x09%s' "$range" | LC_ALL=C sort > /tmp/commits.txt
          wc -l < /tmp/commits.txt | xargs echo "Jumlah commit dalam push:"

          operator="${{ vars.OPERATOR_LOGIN }}"
          ids="$(mktemp)"
          tanpa="$(mktemp)"
          while IFS=$'\t' read -r sha subjek; do
            [ -z "$sha" ] && continue
            izin=""
            # Commit merge adalah tindakan operator (menggabungkan PR) — sah.
            if echo "$subjek" | grep -qE '^Merge (pull request|branch|remote-tracking)'; then
              echo "MERGE  $sha  $subjek"
              continue
            fi
            # Commit operator (per variabel OPERATOR_LOGIN) tidak perlu izin.
            email="$(git show -s --format='%aE' "$sha")"
            if [ -n "$operator" ] && \
               { echo "$email" | grep -qiE "^${operator}@|^[0-9]+\+${operator}@"; }; then
              echo "OWNER  $sha  $subjek  ($email)"
              continue
            fi
            body="$(git show -s --format='%B' "$sha")"
            izin="$(printf '%s' "$body" | grep -oE 'Izin:[[:space:]]+[A-Za-z0-9_-]+' | head -n1 || true)"
            izin="${izin#Izin:}"
            izin="$(printf '%s' "$izin" | xargs || true)"
            if [ -n "$izin" ]; then
              echo "$izin" >> "$ids"
              echo "OK     $sha  $subjek  ->  Izin: $izin"
            else
              echo "$sha  $subjek" >> "$tanpa"
              echo "TANPA  $sha  $subjek"
            fi
          done < /tmp/commits.txt

          echo "ids<<EOF" >> "$GITHUB_OUTPUT"
          sort -u "$ids" 2>/dev/null || true
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "tanpa<<EOF" >> "$GITHUB_OUTPUT"
          cat "$tanpa" 2>/dev/null || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Cocokkan dengan persetujuan di AGENT_BOARD.md
        env:
          IDS: ${{ steps.scan.outputs.ids }}
          TANPA: ${{ steps.scan.outputs.tanpa }}
        run: |
          set -euo pipefail
          gagal=0

          # 1. Commit non-merge tanpa penanda Izin sama sekali.
          if [ -n "$TANPA" ]; then
            echo "::error::Ada commit TANPA penanda 'Izin: <ID>' pada push ini:"
            echo "$TANPA" | sed 's/^/    /'
            echo ""
            echo "Solusi: tulis 'Izin: SESI-<YYYYMMDD>-<NAMA>-<AREA>' pada body setiap"
            echo "commit (atau minta operator mengubahnya lewat squash/merge atau commit"
            echo "tindak lanjut), lalu pastikan ID itu berstatus DISETUJUI di AGENT_BOARD.md."
            gagal=1
          fi

          # 2. ID harus berstatus DISETUJUI di papan.
          if [ -n "${IDS:-}" ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              if grep -qE "^[[:space:]]*\|[[:space:]]*${id}([[:space:]]*\|)" AGENT_BOARD.md && \
                 grep -q "DISETUJUI" <(grep -E "${id}" AGENT_BOARD.md); then
                echo "OK: izin $id ditemukan di AGENT_BOARD.md (DISETUJUI)."
              else
                echo "::error::ID sesi '$id' TIDAK berstatus DISETUJUI di AGENT_BOARD.md."
                echo "         Buka AGENT_BOARD.md → 'Antrean izin push' → minta operator"
                echo "         menandainya DISETUJUI sebelum push berikutnya."
                gagal=1
              fi
            done <<< "$IDS"
          fi

          # 3. Tampilkan keadaan papan agar semua agent saling tahu.
          echo ""
          echo "=== Sesi aktif di AGENT_BOARD.md ==="
          awk -F'|' '/^[[:space:]]*\|[[:space:]]*SESI-/{gsub(/^[[:space:]]+|[[:space:]]+$/,"",$2); gsub(/^[[:space:]]+|[[:space:]]+$/,"",$3); gsub(/^[[:space:]]+|[[:space:]]+$/,"",$4); if ($2!="") print " - " $2 " | " $3 " | " $4}' AGENT_BOARD.md || true

          if [ "$gagal" -ne 0 ]; then
            echo ""
            echo "::error::PUSH TANPA IZIN TERDETEKSI. Baca AGENT.md bagian koordinasi"
            echo "          & izin push sebelum mengulang. Ini audit — main sudah"
            echo "          terlanjur berisi push; kalau harus ditarik, revert segera."
            exit 1
          fi
          echo ""
          echo "SEMUA COMMIT PADA PUSH INI MEMILIKI IZIN YANG DISETUJUI. ✔"
