name: Build Desktop (Tauri + Next.js)

# Shell desktop XyDesk: Tauri v2 (Rust + WebView2) + renderer Next.js
# (static export). Engine Rust dibangun di job Windows, lalu dibundel ke
# installer Inno Setup / Tauri EXE.
#
# Job Linux memverifikasi:
# typecheck renderer, static export, dan unit test.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    name: Periksa Shell (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Pasang dependensi
        working-directory: desktop
        run: npm ci

      - name: Test proses utama & auth
        working-directory: desktop
        run: npm test

      - name: Typecheck renderer
        working-directory: desktop
        run: npm run typecheck

      - name: Build renderer (static export)
        working-directory: desktop
        run: npm run build

  package-windows:
    name: Paket Installer Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-cargo-${{ hashFiles('host/Cargo.lock') }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: desktop-${{ runner.os }}-cargo-

      # Build engine host Rust
      - name: Build engine host (release)
        working-directory: host
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Pasang dependensi frontend
        working-directory: desktop
        run: npm ci

      - name: Build static frontend
        working-directory: desktop
        run: npm run build

      # Build shell Tauri
      - name: Build shell Tauri (release)
        working-directory: desktop/src-tauri
        run: cargo build --release

      - name: Siapkan direktori bundle
        shell: pwsh
        run: |
          $bundle = "desktop/dist/bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/resources/engine" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/drivers" | Out-Null
          Copy-Item "desktop/src-tauri/target/release/xydesk-desktop.exe" "$bundle/XyDesk.exe" -Force
          Copy-Item "host/target/release/xydesk-host.exe" "$bundle/resources/engine/xydesk-host.exe" -Force
          Copy-Item "packaging/windows/drivers/*" "$bundle/drivers/" -Recurse -Force
          if (Test-Path "desktop/out") {
            Copy-Item "desktop/out" "$bundle/out" -Recurse -Force
            Write-Host "[OK] frontend out disalin ke $bundle/out"
          }
          Write-Host "[OK] Bundle siap: $bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: xydesk-desktop-windows-x64
          path: desktop/dist/bundle/*
          if-no-files-found: error
          retention-days: 14
