name: Build

# Build multi-platform XyDesk, SEKARANG difilter per area.
#
# Sebelum 3 Sep 2026: satu job `check` raksasa + build penuh dijalankan untuk
# SEMUA push/PR, sekecil apa pun perubahannya — agent Docs yang menyentuh satu
# file markdown ikut membayar analisis Flutter + Rust + 4 build. Itu lambat dan
# bikin run agent lain saling bertabrakan.
#
# Sekarang: job `changes` (murah, selalu jalan) mendeteksi area yang tersentuh
# dengan dorny/paths-filter. Job lain hanya hidup bila areanya tersentuh:
#
#   lib/, android/, assets/, pubspec.yaml, tool/ → check-flutter (+ android)
#   host/ atau pubspec.yaml                      → host-test (+ windows)
#   web/                                         → web
#   news/                                        → check-news
#   cloudflare/, signaling/                      → check-signaling
#   packaging/                                   → installer-lint
#   docs/, AGENT.md, CHANGELOG, workflow, dll    → check-meta
#
# Aturan penting yang dijaga:
# - `pubspec.yaml` masuk filter flutter DAN host: bump versi rilis (yang
#   menyentuh pubspec) tetap membangun rantai penuh client + host, sehingga
#   release.yml selalu menemukan artefak yang dibutuhkannya.
# - `workflow_dispatch` selalu = build penuh (pemulihan manual).
# - PR tetap diuji tanpa filter branch (pelajaran stacked-PR, lihat bawah) —
#   tetapi job-nya tetap hanya yang areanya berubah.
# - Job `changes` selalu berjalan dan selalu hijau, sehingga PR apa pun punya
#   status check (termasuk PR dokumen) — tidak ada lagi "PR tampil tanpa check".

on:
  # KEBIJAKAN OPERATOR (3 Sep 2026, disempurnakan): push agent TIDAK
  # memicu actions sama sekali. Semua build/kompilasi/kemasan/deploy/rilis
  # = kewenangan role CI/Release (Cakra), dijalankan manual lewat
  # `workflow_dispatch` setelah izin operator — satu run penuh saat semua
  # siap: bump → Build → Release → deploy → berita.
  #
  # Mengapa: build otomatis dari push perantara menghasilkan "hijau palsu"
  # (run terfilter, artefak tak lengkap), run yang terbuang, dan tumpang
  # tindih dengan jadwal rilis operator. Hasil akhir yang dianggap bukti
  # hanya run penuh yang disetujui.
  #
  # Kalau suatu saat area tertentu boleh memicu build parsial, tambahkan
  # path di sini — job `changes` sudah mendukung pemfiltreran per-area.
  workflow_dispatch:

# Satu-satunya pemicu kini `workflow_dispatch` (push tidak memicu actions),
# jadi run Build hanya milik operator yang memintanya. Dispatch berikutnya
# membatalkan run manual lama di ref yang sama — operator yang menekan
# tombol dua kali tetap menjalankan run terbaru saja (pelajaran 3 Sep 2026:
# run Build penuh 6.3.0 sempat dibatalkan push "board" menyusul).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  # google_sign_in serverClientId wajib memakai OAuth Web Client ID, bukan
  # Android Client ID. Android identity tetap dikenali Google lewat package
  # name dan SHA sertifikat di project OAuth.
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # ── 0. Deteksi area yang berubah ──
  # Selalu berjalan (semua PR/push dapat status check), selalu hijau kecuali
  # checkout gagal. Ini "saklar" untuk semua job di bawah.
  changes:
    name: Deteksi Area yang Berubah
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      native: ${{ steps.filter.outputs.native }}
      host: ${{ steps.filter.outputs.host }}
      web: ${{ steps.filter.outputs.web }}
      news: ${{ steps.filter.outputs.news }}
      backend: ${{ steps.filter.outputs.backend }}
      packaging: ${{ steps.filter.outputs.packaging }}
      meta: ${{ steps.filter.outputs.meta }}
      full: ${{ steps.full.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter butuh sejarah penuh untuk membandingkan base..head
          # pada event push (base = commit sebelum push terakhir).
          fetch-depth: 0

      - id: full
        name: Jalankan manual = build penuh
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Kunci pemetaan: area → job. Ubah di sini, plus tabel di
          # docs/CI.md, kalau struktur repo bergeser.
          filters: |
            native:
              - 'android-native/**'
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'android/**'
              - 'design/**'
              - 'tool/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
            # `pubspec.yaml` ikut di sini: bump versi rilis menaikkan nomor
            # di host juga, jadi rantai host/client harus dibangun ulang —
            # kalau tidak, release.yml tidak menemukan artefak Windows.
            # `desktop/**` juga area host: produk Windows = shell Electron
            # (desktop/) + engine Rust (host/), dibangun di job `windows`.
            host:
              - 'host/**'
              - 'desktop/**'
              - 'pubspec.yaml'
            web:
              - 'web/**'
            news:
              - 'news/**'
            backend:
              - 'cloudflare/**'
              - 'signaling/**'
            packaging:
              - 'packaging/**'
            # Versi hidup di banyak manifest; perubahan apa pun di daftar
            # ini diwajibkan lolos check-meta (konsistensi versi + dokumen).
            meta:
              - 'tool/**'
              - 'docs/**'
              - 'AGENT.md'
              - 'AGENT_BOARD.md'
              - 'HANDOFF.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTORS.md'
              - 'README.md'
              - 'ROADMAP.md'
              - 'SETUP.md'
              - '.github/workflows/**'
              - 'pubspec.yaml'
              - 'web/package.json'
              - 'desktop/package.json'
              - 'host/Cargo.toml'

  # ── 1a. Gerbang Android native ──
  # Flutter tidak lagi menjadi jalur APK. Source Flutter lama tidak dipakai
  # oleh artifact Android; seluruh UI, auth, media, dan session berasal dari
  # android-native Kotlin/Compose/JNI.

  # ── 1b. Gerbang mutu Worker berita ──
  check-news:
    name: Uji Worker Berita
    needs: changes
    if: needs.changes.outputs.news == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Uji gerbang badge resmi (news worker)
        run: node --test news/test/*.test.js

  # ── 1c. Gerbang mutu backend (Worker signaling + Go) ──
  check-signaling:
    name: Uji Backend (Worker + Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Worker signaling memegang JWT, OTP, dan rate limit. Sekarang
      # pengawalnya jalan di setiap perubahan cloudflare/**, bukan setelah
      # push ke main lewat deploy-signaling.yml.
      - name: Uji Worker signaling (JWT, OTP, rate limit)
        run: |
          cd cloudflare
          npm ci
          npm test

      # Signaling Go adalah jalur cadangan self-host. Formatnya pernah
      # dibiarkan menyimpang berbulan-bulan karena tidak ada yang mengecek, dan
      # aturan keamanannya (role di token, arah relay) pernah lebih lemah dari
      # Worker produksi. Uji Go kini ikut di sini: `go vet` + `go test` di
      # setiap perubahan backend.
      - name: Cek format Go
        uses: actions/setup-go@v5
        with:
          go-version-file: signaling/go.mod
      - name: Verifikasi gofmt
        run: |
          if [ -n "$(gofmt -l signaling/)" ]; then
            echo "::error::Berkas Go belum diformat. Jalankan: gofmt -w signaling/"
            gofmt -l signaling/
            exit 1
          fi
          echo "OK - semua berkas Go rapi."
      - name: Uji unit Go (signaling)
        run: |
          cd signaling
          go vet ./...
          go test ./...

  # ── 1d. Gerbang lintas-dokumen (versi, CI, status proyek) ──
  # Menjadi status check bagi perubahan dokumen/koordinasi: push Docs &
  # Audit, AGENT.md, CHANGELOG, atau papan koordinasi tetap punya check
  # hijau tanpa membayar build Flutter/Rust.
  check-meta:
    name: Cek Lintas-Dokumen
    needs: changes
    if: needs.changes.outputs.meta == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Nomor versi hidup di satu tempat. Kalau turunannya melenceng, footer
      # web pernah memajang v2.5.0 selama empat rilis.
      - name: Verifikasi versi konsisten di semua manifest
        run: python3 tool/check_version.py

  # ── 2. APK Android native produk ──
  android:
    name: APK Android Native Produk
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-license: true

      - name: Pasang Android SDK, NDK, dan CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Uji unit Kotlin native
        run: gradle -p android-native test

      - name: Build APK native debug
        run: gradle -p android-native assembleDebug

      - name: Verifikasi APK native dan ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a; do
            for library in libxydesk_streamer.so libxydesk_audio.so libxydesk_control.so libxydesk_bridge.so libjingle_peerconnection_so.so; do
              if ! unzip -l "$apk" | grep -q "lib/$abi/$library"; then
                echo "Library wajib hilang: $abi/$library"
                exit 1
              fi
            done
          done
          if unzip -l "$apk" | grep -E 'lib/(x86|x86_64)/|libflutter\.so|libapp\.so|libstreamer\.so'; then
            echo "ABI x86, runtime Flutter, atau libstreamer.so proprietary ditemukan di APK native."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/XyDesk-Android-Native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-Native-debug
          path: dist/XyDesk-Android-Native-debug.apk
          retention-days: 30
          if-no-files-found: error

  # ── 2c. Verifikasi APK Android native tambahan ──
  # Jalur ini menjaga artifact debug terpisah untuk inspeksi JNI/ABI.
  android-native:
    name: Android Native Kotlin + JNI
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-license: true

      - name: Pasang Android SDK, NDK, dan CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Uji unit Kotlin
        run: gradle -p android-native test

      - name: Build APK native debug
        run: gradle -p android-native assembleDebug

      - name: Verifikasi library native dan ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a; do
            for library in libxydesk_streamer.so libxydesk_audio.so libxydesk_control.so libxydesk_bridge.so libjingle_peerconnection_so.so; do
              if ! unzip -l "$apk" | grep -q "lib/$abi/$library"; then
                echo "Library wajib hilang: $abi/$library"
                exit 1
              fi
            done
          done
          if unzip -l "$apk" | grep -E 'lib/(x86|x86_64)/|libflutter\.so|libapp\.so|libstreamer\.so'; then
            echo "ABI x86, runtime Flutter, atau libstreamer.so proprietary ditemukan di APK native."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-Native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ── 2b. Gerbang mutu host (Rust) ──
  #
  # Dijalankan di Linux karena jauh lebih cepat dan murah daripada runner
  # Windows; modul yang diuji (pairguard, identity, input, loopback) tidak
  # bergantung pada API Windows.
  #
  # Pertahanan brute force pairing tidak boleh mundur diam-diam. Kalau job ini
  # merah, host bisa diambil alih — dan karena job `windows` sekarang
  # `needs` job ini, tidak ada .exe maupun Release yang bisa lolos di atasnya.
  host-test:
    name: Uji Logika Host (Rust)
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: test-${{ runner.os }}-cargo-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-cargo-

      - name: Cek format
        working-directory: host
        run: cargo fmt --check

      - name: Clippy tanpa toleransi peringatan
        working-directory: host
        run: cargo clippy --all-targets -- -D warnings

      - name: Uji unit
        working-directory: host
        run: cargo test --all-targets

  # ── 3. Produk Windows: shell Tauri + engine Rust (x64 dan Arm64) ──
  windows:
    name: "Windows ${{ matrix.arch }} (host: shell Tauri + engine)"
    # Gerbang mutu host WAJIB hijau sebelum ada .exe yang lahir.
    # Produk Windows = shell Tauri/Next.js (desktop/) yang mensupervisi
    # engine Rust xydesk-host.exe.
    needs: [changes, host-test]
    if: >-
      needs.changes.outputs.host == 'true' ||
      needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Cache Cargo (host & desktop)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
            desktop/src-tauri/target
          key: native-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('host/Cargo.lock') }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: native-${{ runner.os }}-${{ matrix.arch }}-
      # ── CABANG ARSITEKTUR (keputusan operator 14 Sep 2026) ──
      # x64  = shell ELECTRON (terbukti di rilis-rilis lama; renderer
      #        disajikan lewat HTTP lokal oleh main.cjs; bridge
      #        window.xydesk lengkap; Chromium bawaan = bebas masalah
      #        versi WebView2). electron-builder menghasilkan installer
      #        NSIS utuh (wizard next/lokasi/lisensi) + portabel.
      # arm64 = shell TAURI (Electron di Windows on Arm belum diandalkan;
      #        dipertahankan apa adanya sampai Electron x64 terbukti lagi).
      # Alasan balik arah: shell Tauri ternyata belum menyambung ke engine —
      # renderer hanya mengenal bridge `window.xydesk` yang disediakan
      # preload Electron, sehingga di Tauri UI berjalan dalam MODE DEMO
      # (data contoh), plus protokol asetnya gagal di mesin ber-WebView2
      # tua ("localhost refused to connect" di mesin operator).
      # x64 (Electron) butuh hasil di host/target/release/xydesk-host.exe
      # persis seperti yang dirujuk extraResources package.json — TANPA
      # folder target arsitektur. Dua langkah terpisah (jangan pakai
      # ternary ekspresi: '' itu falsy di GitHub Actions, pernah bikin
      # --target ikut terbawa dan electron-builder kehilangan engine).
      - name: Build engine Rust (release, x64 Electron)
        if: matrix.arch == 'x64'
        working-directory: host
        run: cargo build --release --bin xydesk-host
      - name: Build engine Rust (release, non-x64)
        if: matrix.arch != 'x64'
        working-directory: host
        run: cargo build --release --target ${{ matrix.target }} --bin xydesk-host
      # Native host shell Rust/Win32 — jalur StarDesk-like tanpa Electron.
      # Belum menggantikan shell produk lama sebelum parity UI/control selesai,
      # tetapi selalu dibangun dan dikirim sebagai bundle operator untuk validasi.
      - name: Build native host shell Rust (x64)
        if: matrix.arch == 'x64'
        working-directory: host
        run: cargo build --release --bin xydesk
      - name: Build native host shell Rust (non-x64)
        if: matrix.arch != 'x64'
        working-directory: host
        run: cargo build --release --target ${{ matrix.target }} --bin xydesk
      # ── Jalur x64: Electron ──
      - name: Pasang dependensi shell (Electron, x64)
        if: matrix.arch == 'x64'
        working-directory: desktop
        run: npm ci
      # VDD offline HARUS disiapkan sebelum electron-builder membuat NSIS.
      # Sebelumnya bundle disalin setelah `npm run package`, sehingga
      # win-unpacked benar tetapi installer Setup.exe tetap membawa install.ps1
      # tanpa inf/cer dan jatuh ke download GitHub di mesin operator.
      - name: Siapkan bundle VDD offline sebelum packaging (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $idd = "host/driver/IddSampleDriver"
          Remove-Item $idd -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $idd | Out-Null
          $iddZip = "$env:RUNNER_TEMP\idd.zip"
          $stage = "$env:RUNNER_TEMP\idd-stage"
          $urls = @(
            "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.4/IddSampleDriver.zip",
            "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.3/IddSampleDriver.zip"
          )
          $punya = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $iddZip -UseBasicParsing -ErrorAction Stop
              Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive $iddZip -DestinationPath $stage -Force
              $inner = Join-Path $stage "IddSampleDriver"
              if (Test-Path $inner) { Copy-Item "$inner\*" $idd -Recurse -Force }
              else { Copy-Item "$stage\*" $idd -Recurse -Force }
              $punya = $true
              break
            } catch {
              Write-Host "[WARN] unduh $u gagal: $($_.Exception.Message)"
            }
          }
          if (-not $punya) { throw "Driver VDD gagal diunduh dari semua URL upstream." }
          Copy-Item "packaging/windows/drivers/IddSampleDriver/install.bat" $idd -Force
          Copy-Item "packaging/windows/drivers/IddSampleDriver/uninstall.bat" $idd -Force
          Copy-Item "packaging/windows/drivers/IddSampleDriver/option.txt" $idd -Force
          foreach ($need in @("iddsampledriver.inf", "iddsampledriver.cer", "install.bat")) {
            if (-not (Test-Path (Join-Path $idd $need))) {
              throw "Berkas driver $need tidak ada setelah ekstraksi."
            }
          }
          Write-Host "[OK] Bundle VDD offline siap sebelum electron-builder: $idd"
          Get-ChildItem $idd | ForEach-Object { Write-Host "VDD: $($_.Name)" }
      - name: Paket shell Electron + installer NSIS (x64)
        if: matrix.arch == 'x64'
        working-directory: desktop
        run: npm run package
      - name: Verifikasi bundle Electron (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $dir = "desktop/dist/win-unpacked"
          if (-not (Test-Path "$dir/XyDesk.exe")) { throw "XyDesk.exe tidak ditemukan di $dir" }
          if (-not (Test-Path "$dir/resources/engine/xydesk-host.exe")) {
            throw "engine tidak dibundel (resources/engine/xydesk-host.exe hilang)"
          }
          # Karena VDD sudah disiapkan SEBELUM package, berkas ini sekarang
          # ikut di NSIS Setup.exe, bukan hanya di win-unpacked.
          $idd = "$dir/resources/driver/IddSampleDriver"
          foreach ($need in @("iddsampledriver.inf", "iddsampledriver.cer", "install.bat")) {
            if (-not (Test-Path (Join-Path $idd $need))) {
              throw "Bundle installer kehilangan berkas VDD: $need"
            }
          }
          # drivers/ di akar bundle: parity dengan zip Tauri + dipakai
          # langsung oleh tester tanpa installer.
          New-Item -ItemType Directory -Force -Path "$dir/drivers" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dir/native-host" | Out-Null
          Copy-Item "packaging/windows/drivers/*" "$dir/drivers/" -Recurse -Force
          Copy-Item "host/target/release/xydesk.exe" "$dir/native-host/XyDesk-Native.exe" -Force
          Write-Host "[OK] VDD offline ada di win-unpacked/resources/driver/IddSampleDriver"
          Write-Host "[OK] native host shell Rust ada di win-unpacked/native-host/XyDesk-Native.exe"
          Get-ChildItem $dir | ForEach-Object { Write-Host "OUT: $($_.Name)" }
      - name: Audit dependency DLL engine Rust (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          & .\tool\audit_windows_dependencies.ps1 `
            -Binary @("host/target/release/xydesk-host.exe", "host/target/release/xydesk.exe") `
            -StagingRoot "desktop/dist/win-unpacked"
      - name: Unggah installer Electron (x64)
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Installer-x64
          path: |
            desktop/dist/XyDesk-Desktop-*-x64-Setup.exe
            desktop/dist/XyDesk-Desktop-*-x64-Portable.exe
          if-no-files-found: error
          retention-days: 30
      # ── Jalur arm64: Tauri ──
      - name: Build shell static Next.js
        if: matrix.arch != 'x64'
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Build shell Tauri (release)
        if: matrix.arch != 'x64'
        working-directory: desktop/src-tauri
        run: cargo build --release --target ${{ matrix.target }}
      # Uji unit shell Tauri (logika murni updater: semver, validasi URL
      # manifest, penolakan path asing — tanpa jaringan). Mode --release
      # memakai ulang dependensi yang baru dibangun, jadi langkahnya murah.
      - name: Uji unit shell Tauri
        if: matrix.arch != 'x64'
        working-directory: desktop/src-tauri
        run: cargo test --release --target ${{ matrix.target }}
      - name: Kumpulkan output bundle Windows
        if: matrix.arch != 'x64'
        shell: pwsh
        env:
          OUT_DIR: ${{ format('desktop/dist/{0}', matrix.arch == 'x64' && 'win-unpacked' || format('win-{0}-unpacked', matrix.arch)) }}
        run: |
          $dir = $env:OUT_DIR
          New-Item -ItemType Directory -Force -Path "$dir/resources/engine" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dir/drivers" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dir/native-host" | Out-Null
          Copy-Item "desktop/src-tauri/target/${{ matrix.target }}/release/xydesk-desktop.exe" "$dir/XyDesk.exe" -Force
          Copy-Item "host/target/${{ matrix.target }}/release/xydesk-host.exe" "$dir/resources/engine/xydesk-host.exe" -Force
          Copy-Item "host/target/${{ matrix.target }}/release/xydesk.exe" "$dir/native-host/XyDesk-Native.exe" -Force
          Copy-Item "packaging/windows/drivers/*" "$dir/drivers/" -Recurse -Force
          # Fallback: salin frontend static export untuk Tauri (jika bundle tidak embed, tetap bisa jalan)
          if (Test-Path "desktop/out") {
            Copy-Item "desktop/out" "$dir/out" -Recurse -Force
            Write-Host "[OK] frontend out disalin ke $dir/out"
          } else {
            Write-Host "[WARN] desktop/out tidak ada — Tauri mungkin embed, tapi fallback tidak ada"
          }
          if (-not (Test-Path "$dir/XyDesk.exe")) { throw "XyDesk.exe tidak ditemukan di $dir" }
          if (-not (Test-Path "$dir/resources/engine/xydesk-host.exe")) {
            throw "engine tidak dibundel (resources/engine/xydesk-host.exe hilang)"
          }
          Get-ChildItem $dir | ForEach-Object { Write-Host "OUT: $($_.Name)" }
      - name: Audit dependency DLL engine Rust (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          & .\tool\audit_windows_dependencies.ps1 `
            -Binary @("host/target/${{ matrix.target }}/release/xydesk-host.exe", "host/target/${{ matrix.target }}/release/xydesk.exe") `
            -StagingRoot "desktop/dist/win-arm64-unpacked"
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Windows-${{ matrix.arch }}
          path: ${{ format('desktop/dist/{0}/*', matrix.arch == 'x64' && 'win-unpacked' || format('win-{0}-unpacked', matrix.arch)) }}
          retention-days: 30
          if-no-files-found: error

  web:
    name: Web Application
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi
        working-directory: web
        run: npm ci
      # CSP produksi (`web_deploy/static/_headers`) diperiksa terhadap origin
      # yang benar-benar dipanggil kode. Rilis 6.5.4 memindahkan domain tapi
      # melewatkan berkas ini: bundle live memanggil `signal.xydesk.my.id`
      # sementara `connect-src` masih mengizinkan `signal.xystudio.my.id` yang
      # DNS-nya sudah mati. Build hijau, deploy hijau, halaman 200 — yang
      # rusak hanya terlihat di dalam browser, jadi tidak ada langkah lain
      # yang bisa menangkapnya.
      - name: Uji CSP & sisa domain (web)
        working-directory: web
        run: npm test
      - name: Build Web Release
        working-directory: web
        env:
          # OAuth client WEB (beda dari client Android; bukan secret).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Web
          path: web/dist/*
          retention-days: 30

  # ── 6. Lint installer Inno Setup ──
  # Skrip .iss tidak pernah dikompilasi sampai tahap Release, sehingga error
  # sintaks baru ketahuan saat rilis sedang berjalan. Job ini mengompilasi
  # dengan /O- (tanpa menulis output) supaya kesalahan tertangkap lebih awal.
  installer-lint:
    name: Lint Installer Windows
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile-check XyDesk.iss (x64 dan arm64)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe tidak ditemukan" }
          Write-Host "Memakai compiler: $iscc"

          # Bundle tiruan: lint hanya memerlukan struktur, bukan biner asli.
          $fake = Join-Path $env:RUNNER_TEMP "fake-bundle"
          New-Item -ItemType Directory -Force -Path "$fake\Host" | Out-Null
          Set-Content "$fake\xydesk.exe" "stub"
          Set-Content "$fake\Host\XyDesk-Host.exe" "stub"

          $failed = $false
          foreach ($arch in @("x64", "arm64")) {
            Write-Host "--- Lint arch=$arch ---"
            & $iscc /O- "/DArch=$arch" "/DVersion=0.0.0" `
              "/DSourceDir=$fake" "/DOutputDir=$env:RUNNER_TEMP" `
              "packaging/windows/XyDesk.iss"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::XyDesk.iss gagal compile untuk $arch"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "OK: installer lolos compile-check untuk kedua arsitektur."

  summary:
    name: Ringkasan
    needs: [changes, check-news, check-signaling, check-meta,
            host-test, android, android-native, windows, web, installer-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tulis ringkasan
        env:
          FULL: ${{ needs.changes.outputs.full }}
          FLUTTER: ${{ needs.changes.outputs.flutter }}
          HOST: ${{ needs.changes.outputs.host }}
          WEB: ${{ needs.changes.outputs.web }}
          NEWS: ${{ needs.changes.outputs.news }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          META: ${{ needs.changes.outputs.meta }}
        run: |
          {
            echo "## Hasil Build Multi-Platform XyDesk (difilter per area)"
            echo ""
            echo "Area yang tersentuh pada run ini:"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FULL" = "true" ]; then
            echo "- build penuh (workflow_dispatch)" >> "$GITHUB_STEP_SUMMARY"
          else
            for pair in "$FLUTTER:flutter" "$HOST:host" "$WEB:web" "$NEWS:news" \
                        "$BACKEND:backend" "$PACKAGING:packaging" "$META:meta"; do
              val="${pair%%:*}"
              name="${pair##*:}"
              if [ "$val" = "true" ]; then
                echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          {
            echo ""
            echo "| Job | Status | Artefak |"
            echo "|---|---|---|"
            echo "| Uji Worker Berita            | ${{ needs['check-news'].result }} | — |"
            echo "| Uji Backend (Worker + Go)    | ${{ needs['check-signaling'].result }} | — |"
            echo "| Cek Lintas-Dokumen           | ${{ needs['check-meta'].result }} | — |"
            echo "| Uji Logika Host (Rust)      | ${{ needs['host-test'].result }} | gerbang mutu, tanpa artefak |"
            echo "| Android APK Native          | ${{ needs.android.result }} | \`XyDesk-Android-Native-debug\` |"
            echo "| Android Native (Kotlin/JNI) | ${{ needs['android-native'].result }} | \`XyDesk-Android-Native-debug\` |"
            echo "| Windows Desktop (EXE)       | ${{ needs.windows.result }} | \`XyDesk-Windows-<arch>\` |"
            echo "| Web Application             | ${{ needs.web.result }}     | \`XyDesk-Web\`         |"
            echo "| Lint Installer Windows      | ${{ needs['installer-lint'].result }} | \`packaging/windows\` |"
            echo ""
            echo "Job dengan status \`skipped\` berarti area itu TIDAK tersentuh pada"
            echo "commit ini — itu perilaku filter CI, bukan kegagalan. Apabila branch"
            echo "protection mewajibkan status check, daftar namanya ada di kolom Job."
            echo ""
            echo "Unduh seluruh artefak dari bagian **Artifacts** di bawah halaman ini."
          } >> "$GITHUB_STEP_SUMMARY"
