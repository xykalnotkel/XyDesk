name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push baru membatalkan run lama di branch yang sama — hemat waktu runner
# dan mencegah dua build berebut artefak dengan nama sama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  # ── 1. Gerbang kompilasi: format dan analisis statis ──
  check:
    name: Analisis Statis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Lockfile wajib identik dengan source. `pub get` yang diam-diam mengubah
      # resolusi dependency berarti build lokal dan CI tidak reproduktif.
      - name: Verifikasi dependency lock tidak berubah
        run: git diff --exit-code -- pubspec.lock

      - name: Simpan dependency lock hasil resolusi
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          retention-days: 3

      - name: Cek format (gagal bila ada file belum rapi)
        run: dart format --output=none --set-exit-if-changed lib tool

      - name: Tolak suppression analyzer
        run: |
          if grep -RInE 'ignore_for_file:|//[[:space:]]*ignore:' lib tool; then
            echo "::error::Suppression analyzer dilarang. Perbaiki akar warning/error-nya."
            exit 1
          fi
          if grep -nE '^[[:space:]]*exclude:|:[[:space:]]*ignore$' analysis_options.yaml; then
            echo "::error::analysis_options tidak boleh mengecualikan source atau menurunkan diagnostic menjadi ignore."
            exit 1
          fi

      - name: Analisis statis tanpa toleransi diagnostic
        run: flutter analyze --fatal-infos --fatal-warnings

      # Aturan desain ditegakkan mesin, bukan sekadar ditulis di dokumen.
      - name: Verifikasi aturan seamless
        run: |
          if grep -rn --include='*.dart' -E '\b(Divider|VerticalDivider)\(' lib/; then
            echo "::error::Ditemukan Divider. Desain XyDesk melarang garis pemisah."
            exit 1
          fi
          if grep -rn --include='*.dart' -E 'scrolledUnderElevation:\s*[1-9]' lib/; then
            echo "::error::scrolledUnderElevation > 0 memunculkan garis di bawah AppBar."
            exit 1
          fi
          echo "OK - tidak ada garis pemisah terlarang."

  # ── 2. APK universal (satu berkas, jalan di semua HP Android) ──
  android:
    name: APK Universal
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get

      # Siapkan keystore rilis (dari GitHub Secrets) + key.properties.
      - name: Siapkan signing APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 kosong — lewati signing rilis (fallback debug)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/xydesk-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=xydesk-release.keystore
          EOF

      # ARM Universal = satu APK berisi arm64-v8a & armeabi-v7a (tanpa x86_64).
      #
      # PENTING: --target-platform saja TIDAK cukup. Flag itu hanya mengontrol
      # libflutter.so dan libapp.so; library native milik plugin tetap diambil
      # utuh dari AAR-nya. Penyaring final ada di packaging.jniLibs.excludes;
      # ndk.abiFilters saja terbukti masih dilangkahi integrasi plugin Flutter.
      # Flag ini dipertahankan supaya Flutter tidak membangun artefak yang
      # nantinya dibuang Gradle.
      #
      # GOOGLE_CLIENT_ID repo-var boleh berisi daftar koma (android,web) untuk
      # Worker; aplikasi hanya memakai elemen pertama (client Android).
      - name: Build APK ARM Universal (arm64 & armeabi-v7a)
        run: >-
          flutter build apk --release
          --target-platform=android-arm,android-arm64
          --dart-define=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID%%,*}"

      - name: Ganti nama & ambil ukuran
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XyDesk.apk
          ls -lh dist/
          echo "### APK Universal" >> $GITHUB_STEP_SUMMARY
          echo "Ukuran: $(du -h dist/XyDesk.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY

      # Gerbang regresi ukuran. Bug x86_64 lolos ke rilis v1.0.0 sampai v1.2.0
      # tanpa ada yang sadar karena tidak ada satu pun pemeriksaan otomatis.
      # Pemeriksaan dilakukan terhadap byte/entry final APK, bukan asumsi dari
      # konfigurasi Gradle: integritas zip, ABI wajib, ABI terlarang, library
      # runtime inti, dan ambang ukuran byte-presisi.
      - name: Verifikasi integritas, ABI, runtime, dan ukuran APK
        run: |
          set -euo pipefail
          unzip -tq dist/XyDesk.apk >/dev/null
          rm -rf /tmp/apkcheck
          unzip -q dist/XyDesk.apk -d /tmp/apkcheck

          echo "ABI yang terbungkus:"
          ls /tmp/apkcheck/lib/

          gagal=0
          for abi in x86 x86_64 armeabi mips; do
            if [ -d "/tmp/apkcheck/lib/$abi" ]; then
              ukuran="$(du -sh "/tmp/apkcheck/lib/$abi" | cut -f1)"
              echo "::error::ABI terlarang '$abi' ikut terbungkus ($ukuran). \
          Periksa packaging.jniLibs.excludes di android/app/build.gradle.kts."
              gagal=1
            fi
          done

          for abi in arm64-v8a armeabi-v7a; do
            if [ ! -d "/tmp/apkcheck/lib/$abi" ]; then
              echo "::error::ABI wajib '$abi' hilang dari APK."
              gagal=1
              continue
            fi
            for library in libflutter.so libapp.so libjingle_peerconnection_so.so; do
              if [ ! -s "/tmp/apkcheck/lib/$abi/$library" ]; then
                echo "::error::$abi/$library hilang atau kosong."
                gagal=1
              fi
            done
          done
          [ "$gagal" -eq 0 ] || exit 1

          bytes="$(stat -c%s dist/XyDesk.apk)"
          batas_mb=62
          batas_bytes=$(( batas_mb * 1048576 ))
          ukuran_mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
          # Perbandingan memakai byte. Pembulatan integer sebelumnya membuat
          # APK 62.99 MiB salah terbaca 62 MiB dan lolos.
          echo "Ukuran APK: ${ukuran_mib} MiB (batas ${batas_mb} MiB)"
          if [ "$bytes" -gt "$batas_bytes" ]; then
            echo "::error::APK ${ukuran_mib} MiB melampaui batas ${batas_mb} MiB."
            exit 1
          fi
          {
            echo ""
            echo "| Pemeriksaan | Hasil |"
            echo "|---|---|"
            echo "| Integritas ZIP/APK | Lulus |"
            echo "| ABI terbungkus | $(ls /tmp/apkcheck/lib/ | tr '\n' ' ') |"
            echo "| Runtime inti ARM | Lengkap |"
            echo "| Ukuran APK | ${ukuran_mib} MiB / ${batas_mb} MiB |"
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-APK
          path: dist/XyDesk.apk
          retention-days: 30
          if-no-files-found: error

  # ── 3. Windows Native Desktop (EXE) ──
  windows:
    name: Windows Desktop (EXE)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Windows Platform
        run: flutter create . --platforms=windows
      - name: Build Windows EXE
        run: flutter build windows --release --dart-define=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID%%,*}"
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Windows-EXE
          path: build/windows/x64/runner/Release/*
          retention-days: 30

  # ── 5. Web Application Bundle (Vite + React — bukan Flutter Web) ──
  # Flutter Web ditinggalkan untuk browser: bundle CanvasKit terlalu berat
  # (unduhan MB-an sebelum layar pertama). Client web ringan di web/
  # memakai backend Worker yang sama.
  web:
    name: Web Application
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi
        working-directory: web
        run: npm ci
      - name: Build Web Release
        working-directory: web
        env:
          # OAuth client WEB (beda dari client Android; bukan secret).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Web
          path: web/dist/*
          retention-days: 30

  summary:
    name: Ringkasan
    needs: [android, windows, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tulis ringkasan
        run: |
          {
            echo "## Hasil Build Multi-Platform XyDesk"
            echo ""
            echo "| Target | Status | Artefak |"
            echo "|---|---|---|"
            echo "| Android APK (ARM Universal) | ${{ needs.android.result }} | \`XyDesk-Android-APK\` |"
            echo "| Windows Desktop (EXE)       | ${{ needs.windows.result }} | \`XyDesk-Windows-EXE\` |"
            echo "| Web Application             | ${{ needs.web.result }}     | \`XyDesk-Web\`         |"
            echo ""
            echo "Unduh seluruh artefak dari bagian **Artifacts** di bawah halaman ini."
          } >> $GITHUB_STEP_SUMMARY
