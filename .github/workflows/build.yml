name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push baru membatalkan run lama di branch yang sama — hemat waktu runner
# dan mencegah dua build berebut artefak dengan nama sama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  # ── 1. Gerbang mutu: kalau gagal, build tidak dijalankan sama sekali ──
  check:
    name: Analisis & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Cek format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisis statis
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter compact

      # Aturan desain ditegakkan mesin, bukan sekadar ditulis di dokumen.
      - name: Verifikasi aturan seamless
        run: |
          if grep -rn --include='*.dart' -E '\b(Divider|VerticalDivider)\(' lib/; then
            echo "::error::Ditemukan Divider. Desain XyDesk melarang garis pemisah."
            exit 1
          fi
          if grep -rn --include='*.dart' -E 'scrolledUnderElevation:\s*[1-9]' lib/; then
            echo "::error::scrolledUnderElevation > 0 memunculkan garis di bawah AppBar."
            exit 1
          fi
          echo "OK - tidak ada garis pemisah terlarang."

  # ── 2. APK universal (satu berkas, jalan di semua HP Android) ──
  android:
    name: APK Universal
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get

      # Universal = satu APK berisi semua arsitektur. Ukurannya lebih besar
      # daripada split-per-ABI, tapi cukup satu berkas untuk dibagikan.
      - name: Build APK universal
        run: flutter build apk --release

      - name: Ganti nama & ambil ukuran
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XyDesk.apk
          ls -lh dist/
          echo "### APK Universal" >> $GITHUB_STEP_SUMMARY
          echo "Ukuran: $(du -h dist/XyDesk.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-APK
          path: dist/XyDesk.apk
          retention-days: 30
          if-no-files-found: error

  # ── 3. Windows portable (ZIP, tanpa instalasi) ──
  windows:
    name: Windows ZIP
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # Folder windows/ tidak ikut di-commit; dibuat ulang di runner.
      - name: Siapkan proyek Windows
        run: flutter create --platforms=windows .

      - name: Build Windows
        run: flutter build windows --release

      - name: Kemas ZIP portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "build/windows/x64/runner/Release"
          # Catatan singkat untuk pengguna awam yang mengekstrak ZIP-nya.
          @"
          XyDesk - Windows Portable

          Jalankan xydesk.exe untuk membuka aplikasi.
          Tidak perlu instalasi. Seluruh isi folder harus tetap bersama;
          file .dll di sini dibutuhkan aplikasi untuk berjalan.

          Jika Windows SmartScreen muncul: klik "More info" lalu
          "Run anyway". Ini terjadi karena build belum ditandatangani
          secara digital.
          "@ | Out-File -FilePath "$src/BACA-SAYA.txt" -Encoding utf8
          Compress-Archive -Path "$src/*" -DestinationPath "dist/XyDesk-Windows-x64.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Windows-ZIP
          path: dist/XyDesk-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error

  # ── 4. Ringkasan supaya hasil terlihat langsung di halaman run ──
  summary:
    name: Ringkasan
    needs: [android, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tulis ringkasan
        run: |
          {
            echo "## Hasil Build XyDesk"
            echo ""
            echo "| Target | Status | Artefak |"
            echo "|---|---|---|"
            echo "| Android APK universal | ${{ needs.android.result }} | \`XyDesk-Android-APK\` |"
            echo "| Windows x64 portable | ${{ needs.windows.result }} | \`XyDesk-Windows-ZIP\` |"
            echo ""
            echo "Unduh dari bagian **Artifacts** di bawah halaman ini."
            echo "Artefak tersimpan 30 hari."
          } >> $GITHUB_STEP_SUMMARY
