name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push baru membatalkan run lama di branch yang sama — hemat waktu runner
# dan mencegah dua build berebut artefak dengan nama sama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  # ── 1. Gerbang mutu: kalau gagal, build tidak dijalankan sama sekali ──
  check:
    name: Analisis & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Cek & rapikan format
        run: dart format lib test

      - name: Analisis statis
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter compact

      # Aturan desain ditegakkan mesin, bukan sekadar ditulis di dokumen.
      - name: Verifikasi aturan seamless
        run: |
          if grep -rn --include='*.dart' -E '\b(Divider|VerticalDivider)\(' lib/; then
            echo "::error::Ditemukan Divider. Desain XyDesk melarang garis pemisah."
            exit 1
          fi
          if grep -rn --include='*.dart' -E 'scrolledUnderElevation:\s*[1-9]' lib/; then
            echo "::error::scrolledUnderElevation > 0 memunculkan garis di bawah AppBar."
            exit 1
          fi
          echo "OK - tidak ada garis pemisah terlarang."

  # ── 2. APK universal (satu berkas, jalan di semua HP Android) ──
  android:
    name: APK Universal
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get

      # ARM Universal = satu APK berisi arm64-v8a & armeabi-v7a (tanpa x86_64).
      # Ukuran jauh lebih ringan dan jalan di 99.9% HP Android nyata.
      - name: Build APK ARM Universal (arm64 & armeabi-v7a)
        run: flutter build apk --release --target-platform=android-arm,android-arm64

      - name: Ganti nama & ambil ukuran
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XyDesk.apk
          ls -lh dist/
          echo "### APK Universal" >> $GITHUB_STEP_SUMMARY
          echo "Ukuran: $(du -h dist/XyDesk.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-APK
          path: dist/XyDesk.apk
          retention-days: 30
          if-no-files-found: error

  # ── 3. Windows Native Desktop (EXE) ──
  windows:
    name: Windows Desktop (EXE)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Windows Platform
        run: flutter create . --platforms=windows
      - name: Build Windows EXE
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Windows-EXE
          path: build/windows/x64/runner/Release/*
          retention-days: 30

  # ── 4. iOS App Bundle (Unsigned untuk AltStore / Simulator) ──
  ios:
    name: iOS App Bundle (Unsigned)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure iOS Platform
        run: flutter create . --platforms=ios
      - name: Build iOS Unsigned App
        run: flutter build ios --no-codesign --release
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-iOS-App
          path: build/ios/iphoneos/Runner.app/
          retention-days: 30

  # ── 5. Web Application Bundle ──
  web:
    name: Web Application
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Web Platform
        run: flutter create . --platforms=web
      - name: Build Web Release
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Web
          path: build/web/*
          retention-days: 30

  # ── 6. Linux Native Desktop ──
  linux:
    name: Linux Desktop (x64)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build libgtk-3-dev pkg-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Linux Platform
        run: flutter create . --platforms=linux
      - name: Build Linux Desktop
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Linux-x64
          path: build/linux/x64/release/bundle/*
          retention-days: 30

  summary:
    name: Ringkasan
    needs: [android, windows, ios, web, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tulis ringkasan
        run: |
          {
            echo "## Hasil Build Multi-Platform XyDesk"
            echo ""
            echo "| Target | Status | Artefak |"
            echo "|---|---|---|"
            echo "| Android APK (ARM Universal) | ${{ needs.android.result }} | \`XyDesk-Android-APK\` |"
            echo "| Windows Desktop (EXE)       | ${{ needs.windows.result }} | \`XyDesk-Windows-EXE\` |"
            echo "| iOS App (Unsigned App)      | ${{ needs.ios.result }}     | \`XyDesk-iOS-App\`     |"
            echo "| Web Application             | ${{ needs.web.result }}     | \`XyDesk-Web\`         |"
            echo "| Linux Desktop (x64)         | ${{ needs.linux.result }}   | \`XyDesk-Linux-x64\`   |"
            echo ""
            echo "Unduh seluruh artefak dari bagian **Artifacts** di bawah halaman ini."
          } >> $GITHUB_STEP_SUMMARY
