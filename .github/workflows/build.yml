name: Build

# Build multi-platform XyDesk, SEKARANG difilter per area.
#
# Sebelum 3 Sep 2026: satu job `check` raksasa + build penuh dijalankan untuk
# SEMUA push/PR, sekecil apa pun perubahannya — agent Docs yang menyentuh satu
# file markdown ikut membayar analisis Flutter + Rust + 4 build. Itu lambat dan
# bikin run agent lain saling bertabrakan.
#
# Sekarang: job `changes` (murah, selalu jalan) mendeteksi area yang tersentuh
# dengan dorny/paths-filter. Job lain hanya hidup bila areanya tersentuh:
#
#   lib/, android/, assets/, pubspec.yaml, tool/ → check-flutter (+ android)
#   host/ atau pubspec.yaml                      → host-test (+ windows)
#   web/                                         → web
#   news/                                        → check-news
#   cloudflare/, signaling/                      → check-signaling
#   packaging/                                   → installer-lint
#   docs/, AGENT.md, CHANGELOG, workflow, dll    → check-meta
#
# Aturan penting yang dijaga:
# - `pubspec.yaml` masuk filter flutter DAN host: bump versi rilis (yang
#   menyentuh pubspec) tetap membangun rantai penuh client + host, sehingga
#   release.yml selalu menemukan artefak yang dibutuhkannya.
# - `workflow_dispatch` selalu = build penuh (pemulihan manual).
# - PR tetap diuji tanpa filter branch (pelajaran stacked-PR, lihat bawah) —
#   tetapi job-nya tetap hanya yang areanya berubah.
# - Job `changes` selalu berjalan dan selalu hijau, sehingga PR apa pun punya
#   status check (termasuk PR dokumen) — tidak ada lagi "PR tampil tanpa check".

on:
  push:
    branches: [main]
  # SENGAJA tanpa filter `branches`.
  #
  # Sebelumnya di sini ada `branches: [main]`, yang berarti workflow hanya
  # berjalan untuk pull request yang menargetkan main. Pull request bertumpuk
  # — PR kedua yang basisnya branch PR pertama, pola normal saat memecah
  # perubahan besar — tidak diuji sama sekali dan tampil TANPA status check.
  # Bukan merah, bukan hijau: kosong. Itu bentuk kegagalan paling berbahaya,
  # karena terlihat seperti tidak ada masalah.
  pull_request:
  workflow_dispatch:

# Push baru membatalkan run lama di branch yang sama — hemat waktu runner
# dan mencegah dua build berebut artefak dengan nama sama.
#
# Khusus dispatch (build penuh / pemulihan rilis) dijalankan di jalur
# tersendiri (`manual`) supaya TIDAK dibatalkan push biasa. Pelajaran nyata
# (3 Sep 2026): run Build penuh untuk bump versi 6.3.0 dibatalkan oleh push
# "board" berikutnya akibat cancel-in-progress — rilis jadi buntu.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  # google_sign_in serverClientId wajib memakai OAuth Web Client ID, bukan
  # Android Client ID. Android identity tetap dikenali Google lewat package
  # name dan SHA sertifikat di project OAuth.
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # ── 0. Deteksi area yang berubah ──
  # Selalu berjalan (semua PR/push dapat status check), selalu hijau kecuali
  # checkout gagal. Ini "saklar" untuk semua job di bawah.
  changes:
    name: Deteksi Area yang Berubah
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      host: ${{ steps.filter.outputs.host }}
      web: ${{ steps.filter.outputs.web }}
      news: ${{ steps.filter.outputs.news }}
      backend: ${{ steps.filter.outputs.backend }}
      packaging: ${{ steps.filter.outputs.packaging }}
      meta: ${{ steps.filter.outputs.meta }}
      full: ${{ steps.full.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter butuh sejarah penuh untuk membandingkan base..head
          # pada event push (base = commit sebelum push terakhir).
          fetch-depth: 0

      - id: full
        name: Jalankan manual = build penuh
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Kunci pemetaan: area → job. Ubah di sini, plus tabel di
          # docs/CI.md, kalau struktur repo bergeser.
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'android/**'
              - 'design/**'
              - 'tool/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
            # `pubspec.yaml` ikut di sini: bump versi rilis menaikkan nomor
            # di host juga, jadi rantai host/client harus dibangun ulang —
            # kalau tidak, release.yml tidak menemukan artefak Windows.
            host:
              - 'host/**'
              - 'pubspec.yaml'
            web:
              - 'web/**'
            news:
              - 'news/**'
            backend:
              - 'cloudflare/**'
              - 'signaling/**'
            packaging:
              - 'packaging/**'
            # Versi hidup di banyak manifest; perubahan apa pun di daftar
            # ini diwajibkan lolos check-meta (konsistensi versi + dokumen).
            meta:
              - 'tool/**'
              - 'docs/**'
              - 'AGENT.md'
              - 'AGENT_BOARD.md'
              - 'HANDOFF.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTORS.md'
              - 'README.md'
              - 'ROADMAP.md'
              - 'SETUP.md'
              - '.github/workflows/**'
              - 'pubspec.yaml'
              - 'web/package.json'
              - 'desktop/package.json'
              - 'host/Cargo.toml'

  # ── 1a. Gerbang kompilasi & mutu client Flutter ──
  check-flutter:
    name: Analisis Statis (Flutter)
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Lockfile wajib identik dengan source. `pub get` yang diam-diam mengubah
      # resolusi dependency berarti build lokal dan CI tidak reproduktif.
      - name: Verifikasi dependency lock tidak berubah
        run: git diff --exit-code -- pubspec.lock

      - name: Simpan dependency lock hasil resolusi
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          retention-days: 3

      - name: Cek format (gagal bila ada file belum rapi)
        run: dart format --output=none --set-exit-if-changed lib tool

      - name: Tolak suppression analyzer
        run: |
          if grep -RInE 'ignore_for_file:|//[[:space:]]*ignore:' lib tool; then
            echo "::error::Suppression analyzer dilarang. Perbaiki akar warning/error-nya."
            exit 1
          fi
          if grep -nE '^[[:space:]]*exclude:|:[[:space:]]*ignore$' analysis_options.yaml; then
            echo "::error::analysis_options tidak boleh mengecualikan source atau menurunkan diagnostic menjadi ignore."
            exit 1
          fi

      - name: Analisis statis tanpa toleransi diagnostic
        run: flutter analyze --fatal-infos --fatal-warnings

      # Uji unit Dart. Sampai sekarang tidak pernah dijalankan CI, padahal
      # test/webrtc/input_codec_test.dart mengunci format protokol input
      # biner yang dipakai host/src/input.rs — kalau formatnya bergeser
      # tanpa sengaja, yang rusak bukan "test yang merah", melainkan
      # keyboard dan mouse di komputer orang. Uji yang tidak pernah
      # dijalankan sama saja dengan tidak punya uji.
      - name: Uji unit Dart
        run: flutter test

      # Inventaris lisensi wajib mencerminkan lockfile saat ini. Kalau
      # dependensi berubah tanpa regenerasi, dokumen legal jadi bohong —
      # dan itu kewajiban hukum, bukan sekadar dokumentasi.
      - name: Verifikasi inventaris lisensi mutakhir
        run: node tool/gen-licenses.mjs --check

      - name: Audit ilustrasi transparan untuk semua tema
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/audit_assets.py

      # Aturan desain ditegakkan mesin, bukan sekadar ditulis di dokumen.
      - name: Verifikasi aturan seamless
        run: |
          if grep -rn --include='*.dart' -E '\b(Divider|VerticalDivider)\(' lib/; then
            echo "::error::Ditemukan Divider. Desain XyDesk melarang garis pemisah."
            exit 1
          fi
          if grep -rn --include='*.dart' -E 'scrolledUnderElevation:\s*[1-9]' lib/; then
            echo "::error::scrolledUnderElevation > 0 memunculkan garis di bawah AppBar."
            exit 1
          fi
          echo "OK - tidak ada garis pemisah terlarang."

  # ── 1b. Gerbang mutu Worker berita ──
  check-news:
    name: Uji Worker Berita
    needs: changes
    if: needs.changes.outputs.news == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Uji gerbang badge resmi (news worker)
        run: node --test news/test/*.test.js

  # ── 1c. Gerbang mutu backend (Worker signaling + Go) ──
  check-signaling:
    name: Uji Backend (Worker + Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Worker signaling memegang JWT, OTP, dan rate limit. Sekarang
      # pengawalnya jalan di setiap perubahan cloudflare/**, bukan setelah
      # push ke main lewat deploy-signaling.yml.
      - name: Uji Worker signaling (JWT, OTP, rate limit)
        run: |
          cd cloudflare
          npm ci
          npm test

      # Signaling Go adalah jalur cadangan self-host. Formatnya pernah
      # dibiarkan menyimpang berbulan-bulan karena tidak ada yang mengecek, dan
      # aturan keamanannya (role di token, arah relay) pernah lebih lemah dari
      # Worker produksi. Uji Go kini ikut di sini: `go vet` + `go test` di
      # setiap perubahan backend.
      - name: Cek format Go
        uses: actions/setup-go@v5
        with:
          go-version-file: signaling/go.mod
      - name: Verifikasi gofmt
        run: |
          if [ -n "$(gofmt -l signaling/)" ]; then
            echo "::error::Berkas Go belum diformat. Jalankan: gofmt -w signaling/"
            gofmt -l signaling/
            exit 1
          fi
          echo "OK - semua berkas Go rapi."
      - name: Uji unit Go (signaling)
        run: |
          cd signaling
          go vet ./...
          go test ./...

  # ── 1d. Gerbang lintas-dokumen (versi, CI, status proyek) ──
  # Menjadi status check bagi perubahan dokumen/koordinasi: push Docs &
  # Audit, AGENT.md, CHANGELOG, atau papan koordinasi tetap punya check
  # hijau tanpa membayar build Flutter/Rust.
  check-meta:
    name: Cek Lintas-Dokumen
    needs: changes
    if: needs.changes.outputs.meta == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Nomor versi hidup di satu tempat. Kalau turunannya melenceng, footer
      # web pernah memajang v2.5.0 selama empat rilis.
      - name: Verifikasi versi konsisten di semua manifest
        run: python3 tool/check_version.py

  # ── 2. APK per ABI: unduhan kecil, tanpa universal gemuk ──
  android:
    name: APK Android per ABI
    needs: [changes, check-flutter]
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get

      - name: Siapkan signing APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 kosong — lewati signing rilis (fallback debug)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/xydesk-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=xydesk-release.keystore
          EOF

      # Dua APK saja: ARM64 untuk perangkat modern dan ARMv7 untuk Android
      # 32-bit. Tidak ada universal dan tidak ada x86/x86_64.
      - name: Build APK terpisah ARM64 dan ARMv7
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform=android-arm,android-arm64
          --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Namai paket berdasarkan ABI
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/XyDesk-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            dist/XyDesk-Android-armeabi-v7a.apk
          ls -lh dist/

      - name: Verifikasi setiap APK hanya memuat ABI yang benar
        run: |
          set -euo pipefail
          gagal=0
          for abi in arm64-v8a armeabi-v7a; do
            apk="dist/XyDesk-Android-${abi}.apk"
            root="/tmp/apk-${abi}"
            unzip -tq "$apk" >/dev/null
            rm -rf "$root"
            unzip -q "$apk" -d "$root"

            actual="$(find "$root/lib" -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort | paste -sd, -)"
            if [ "$actual" != "$abi" ]; then
              echo "::error::$apk memuat ABI '$actual', seharusnya hanya '$abi'."
              gagal=1
            fi
            for library in libflutter.so libapp.so libjingle_peerconnection_so.so; do
              if [ ! -s "$root/lib/$abi/$library" ]; then
                echo "::error::$apk kehilangan $abi/$library."
                gagal=1
              fi
            done

            bytes="$(stat -c%s "$apk")"
            limit_bytes=$(( 40 * 1048576 ))
            size_mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
            if [ "$bytes" -gt "$limit_bytes" ]; then
              echo "::error::$apk berukuran ${size_mib} MiB, melampaui 40 MiB."
              gagal=1
            fi
            echo "$abi: ${size_mib} MiB"
            {
              echo "| Android $abi | ${size_mib} MiB | ABI tunggal, runtime lengkap |"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$gagal" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Android-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

  # ── 2b. Gerbang mutu host (Rust) ──
  #
  # Dijalankan di Linux karena jauh lebih cepat dan murah daripada runner
  # Windows; modul yang diuji (pairguard, identity, input, loopback) tidak
  # bergantung pada API Windows.
  #
  # Pertahanan brute force pairing tidak boleh mundur diam-diam. Kalau job ini
  # merah, host bisa diambil alih — dan karena job `windows` sekarang
  # `needs` job ini, tidak ada .exe maupun Release yang bisa lolos di atasnya.
  host-test:
    name: Uji Logika Host (Rust)
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: test-${{ runner.os }}-cargo-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-cargo-

      - name: Cek format
        working-directory: host
        run: cargo fmt --check

      - name: Clippy tanpa toleransi peringatan
        working-directory: host
        run: cargo clippy --all-targets -- -D warnings

      - name: Uji unit
        working-directory: host
        run: cargo test --all-targets

  # ── 3. Windows Native Desktop: x64 dan Arm64 resmi Flutter ──
  windows:
    name: Windows ${{ matrix.arch }} (native)
    # Gerbang mutu host WAJIB hijau sebelum ada .exe yang lahir. Sebelumnya
    # fmt/clippy/cargo test tinggal di workflow terpisah (build-host.yml) yang
    # bukan syarat rilis apa pun — akibatnya v6.1.0 sempat terbit sementara
    # gerbang itu merah pada commit yang sama. Sekarang satu rantai.
    needs: [changes, check-flutter, host-test]
    if: >-
      needs.changes.outputs.flutter == 'true' ||
      needs.changes.outputs.host == 'true' ||
      needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo (host)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: native-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build GUI native + engine (satu crate)
        working-directory: host
        run: cargo build --release --target ${{ matrix.target }} --bins
      - name: Kumpulkan output
        shell: pwsh
        run: |
          $dir = "host/target/${{ matrix.target }}/release"
          foreach ($f in @("xydesk.exe","xydesk-host.exe")) {
            if (-not (Test-Path "$dir/$f")) { throw "$f tidak ditemukan" }
          }
          New-Item -ItemType Directory -Force -Path out-desktop | Out-Null
          Copy-Item "$dir/xydesk.exe" out-desktop/XyDesk.exe
          Copy-Item "$dir/xydesk-host.exe" out-desktop/XyDesk-Host.exe
          Get-ChildItem out-desktop | ForEach-Object { Write-Host "OUT: $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Windows-${{ matrix.arch }}
          path: out-desktop/*
          retention-days: 30
          if-no-files-found: error

  web:
    name: Web Application
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi
        working-directory: web
        run: npm ci
      - name: Build Web Release
        working-directory: web
        env:
          # OAuth client WEB (beda dari client Android; bukan secret).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Web
          path: web/dist/*
          retention-days: 30

  # ── 6. Lint installer Inno Setup ──
  # Skrip .iss tidak pernah dikompilasi sampai tahap Release, sehingga error
  # sintaks baru ketahuan saat rilis sedang berjalan. Job ini mengompilasi
  # dengan /O- (tanpa menulis output) supaya kesalahan tertangkap lebih awal.
  installer-lint:
    name: Lint Installer Windows
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile-check XyDesk.iss (x64 dan arm64)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe tidak ditemukan" }
          Write-Host "Memakai compiler: $iscc"

          # Bundle tiruan: lint hanya memerlukan struktur, bukan biner asli.
          $fake = Join-Path $env:RUNNER_TEMP "fake-bundle"
          New-Item -ItemType Directory -Force -Path "$fake\Host" | Out-Null
          Set-Content "$fake\xydesk.exe" "stub"
          Set-Content "$fake\Host\XyDesk-Host.exe" "stub"

          $failed = $false
          foreach ($arch in @("x64", "arm64")) {
            Write-Host "--- Lint arch=$arch ---"
            & $iscc /O- "/DArch=$arch" "/DVersion=0.0.0" `
              "/DSourceDir=$fake" "/DOutputDir=$env:RUNNER_TEMP" `
              "packaging/windows/XyDesk.iss"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::XyDesk.iss gagal compile untuk $arch"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "OK: installer lolos compile-check untuk kedua arsitektur."

  summary:
    name: Ringkasan
    needs: [changes, check-flutter, check-news, check-signaling, check-meta,
            host-test, android, windows, web, installer-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tulis ringkasan
        env:
          FULL: ${{ needs.changes.outputs.full }}
          FLUTTER: ${{ needs.changes.outputs.flutter }}
          HOST: ${{ needs.changes.outputs.host }}
          WEB: ${{ needs.changes.outputs.web }}
          NEWS: ${{ needs.changes.outputs.news }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          META: ${{ needs.changes.outputs.meta }}
        run: |
          {
            echo "## Hasil Build Multi-Platform XyDesk (difilter per area)"
            echo ""
            echo "Area yang tersentuh pada run ini:"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FULL" = "true" ]; then
            echo "- build penuh (workflow_dispatch)" >> "$GITHUB_STEP_SUMMARY"
          else
            for pair in "$FLUTTER:flutter" "$HOST:host" "$WEB:web" "$NEWS:news" \
                        "$BACKEND:backend" "$PACKAGING:packaging" "$META:meta"; do
              val="${pair%%:*}"
              name="${pair##*:}"
              if [ "$val" = "true" ]; then
                echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          {
            echo ""
            echo "| Job | Status | Artefak |"
            echo "|---|---|---|"
            echo "| Analisis Statis (Flutter)    | ${{ needs['check-flutter'].result }} | gerbang mutu client |"
            echo "| Uji Worker Berita            | ${{ needs['check-news'].result }} | — |"
            echo "| Uji Backend (Worker + Go)    | ${{ needs['check-signaling'].result }} | — |"
            echo "| Cek Lintas-Dokumen           | ${{ needs['check-meta'].result }} | — |"
            echo "| Uji Logika Host (Rust)      | ${{ needs['host-test'].result }} | gerbang mutu, tanpa artefak |"
            echo "| Android APK (ARM Universal) | ${{ needs.android.result }} | \`XyDesk-Android-APK\` |"
            echo "| Windows Desktop (EXE)       | ${{ needs.windows.result }} | \`XyDesk-Windows-<arch>\` |"
            echo "| Web Application             | ${{ needs.web.result }}     | \`XyDesk-Web\`         |"
            echo "| Lint Installer Windows      | ${{ needs['installer-lint'].result }} | \`packaging/windows\` |"
            echo ""
            echo "Job dengan status \`skipped\` berarti area itu TIDAK tersentuh pada"
            echo "commit ini — itu perilaku filter CI, bukan kegagalan. Apabila branch"
            echo "protection mewajibkan status check, daftar namanya ada di kolom Job."
            echo ""
            echo "Unduh seluruh artefak dari bagian **Artifacts** di bawah halaman ini."
          } >> "$GITHUB_STEP_SUMMARY"
