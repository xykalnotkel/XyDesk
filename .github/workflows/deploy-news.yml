name: Deploy News (Cloudflare Workers + D1)

# Deploy Worker berita publik (news.xystudio.my.id) — TERPISAH dari Worker
# signaling agar deploy berita tidak pernah menyentuh jalur signaling
# produksi. Migrasi skema D1 dijalankan dulu (idempoten).

on:
  # Manual hanya (kebijakan 3 Sep 2026): deploy = setelah Build yang
  # disetujui. Push ke `news/**` tidak men-deploy otomatis.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy News Worker + migrasi D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pasang dependensi
        working-directory: news
        run: npm ci

      # URUTAN DI BAWAH INI PENTING DAN TIDAK BOLEH DIBALIK.
      #
      # Worker baru boleh menyala hanya setelah database punya semua kolom
      # yang dipakainya. Saat kolom `official` ditambahkan ke Worker tanpa
      # langkah migrasi di bawah, SELECT-nya gagal dan seluruh endpoint
      # detail berita membalas 500 — bukan hanya fitur badge-nya.

      - name: Migrasi skema D1 (tabel baru)
        working-directory: news
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:init

      # `schema.sql` memakai CREATE TABLE IF NOT EXISTS, jadi database yang
      # sudah ada TIDAK pernah menerima kolom baru darinya. Kolom baru hanya
      # masuk lewat berkas ini.
      - name: Migrasi kolom D1 (idempoten)
        working-directory: news
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node migrate.mjs

      # Artikel bawaan repo, termasuk changelog rilis yang ditautkan footer
      # web lewat slug `changelog-v<versi>`. UPSERT per slug — aman diulang,
      # dan perbaikan isi artikel ikut terkirim.
      - name: Terbitkan artikel bawaan repo
        working-directory: news
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:seed

      - name: Deploy Worker
        working-directory: news
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
