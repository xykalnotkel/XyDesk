name: Deploy Signaling (Cloudflare Workers)

# Build & deploy backend signaling ke Cloudflare — tanpa VM/VPS, gratis.
# Trigger: push ke cloudflare/** atau manual. Secret yang dibutuhkan:
#   CLOUDFLARE_API_TOKEN  → isi dari file "CloudflareApiToken (1).txt"
#   CLOUDFLARE_ACCOUNT_ID → ID akun Cloudflare (dashboard → Workers)
#   XYDESK_SECRET         → openssl rand -hex 32
#   ADMIN_SECRET          → kata sandi untuk endpoint /issue
#   AUTH_SECRET           → kunci JWT/OTP terpisah
#   RESEND_API_KEY        → pengiriman email OTP
# Variable repo: GOOGLE_CLIENT_ID dan RESEND_FROM

on:
  push:
    paths:
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker + Durable Object
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang dependensi
        working-directory: cloudflare
        run: npm ci

      - name: Uji end-to-end (signaling + auth) sebelum deploy
        working-directory: cloudflare
        env:
          XYDESK_SECRET: ${{ secrets.XYDESK_SECRET }}
          ADMIN_SECRET: test-admin
        run: |
          # .dev.vars tidak di-commit, jadi secret dipasok via --var.
          npx wrangler dev --port 8787 --ip 127.0.0.1 \
            --var XYDESK_SECRET:"$XYDESK_SECRET" \
            --var ADMIN_SECRET:test-admin \
            --var XYDESK_DEV:true &
          WRANGLER_PID=$!
          # tunggu server siap
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8787/healthz >/dev/null && break
            sleep 1
          done
          node test/signaling.test.mjs
          S1=$?
          node test/auth.test.mjs
          S2=$?
          # matikan wrangler dev agar step tidak menggantung
          kill "$WRANGLER_PID" 2>/dev/null || true
          if [ $S1 -ne 0 ] || [ $S2 -ne 0 ]; then exit 1; fi

      - name: Deploy ke Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XYDESK_SECRET: ${{ secrets.XYDESK_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
        run: |
          # Rahasia dipasang dari GitHub Secrets, tidak pernah dari source.
          set_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name belum diatur di GitHub Secrets/Variables"
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          }
          set_secret XYDESK_SECRET "$XYDESK_SECRET"
          set_secret ADMIN_SECRET "$ADMIN_SECRET"
          set_secret AUTH_SECRET "$AUTH_SECRET"
          set_secret RESEND_API_KEY "$RESEND_API_KEY"
          set_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          set_secret RESEND_FROM "$RESEND_FROM"
          npx wrangler deploy
