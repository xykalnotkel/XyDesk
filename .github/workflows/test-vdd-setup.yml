name: Test VDD Setup Policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Policy regression (powershell)
        shell: powershell
        run: ./packaging/tests/test-vdd-policy.ps1
      - name: Native helper WhatIf (powershell)
        shell: powershell
        run: |
          ./packaging/manual-host/Setup-VirtualDisplay.ps1 -Install -WhatIf
          ./packaging/manual-host/Setup-VirtualDisplay.ps1 -Install -Resume -WhatIf
      - name: Pinned catalog verification (powershell)
        shell: powershell
        run: ./packaging/manual-host/Setup-VirtualDisplay.ps1 -VerifyOnly
      - name: Policy regression (pwsh)
        shell: pwsh
        run: ./packaging/tests/test-vdd-policy.ps1
      - name: Native helper WhatIf (pwsh)
        shell: pwsh
        run: |
          ./packaging/manual-host/Setup-VirtualDisplay.ps1 -Install -WhatIf
          ./packaging/manual-host/Setup-VirtualDisplay.ps1 -Install -Resume -WhatIf
      - name: Pinned catalog verification (pwsh)
        shell: pwsh
        run: ./packaging/manual-host/Setup-VirtualDisplay.ps1 -VerifyOnly
